      <div class="box ex"><span class="tag">Exemple concret</span>« S’il pleut, je prends mon parapluie. » Je ne mens que s’il pleut <i>et</i> que je n’ai pas de parapluie. S’il ne pleut pas, la promesse tient, quoi que je fasse.</div>
      <div class="box def"><span class="tag">Réciproque et contraposée</span>La <b>réciproque</b> de \(P \Rightarrow Q\) est \(Q \Rightarrow P\) : aucun lien de vérité. La <b>contraposée</b> est \(\text{non}\,Q \Rightarrow \text{non}\,P\) : toujours équivalente à la phrase de départ.</div>
      <div class="box ex"><span class="tag">Exemple</span>« Si \(x = 2\), alors \(x^2 = 4\) » est vraie. Sa réciproque est fausse (\(x = -2\)). Sa contraposée « si \(x^2 \neq 4\), alors \(x \neq 2\) » est vraie.</div>` },
    { titre: "Quantificateurs et négation", html: String.raw`
      <div class="box def"><span class="tag">Définition</span>\(\forall\) : « pour tout » (chaque élément). \(\exists\) : « il existe » (au moins un élément).</div>
      <div class="box thm"><span class="tag">Règles de négation</span>
        non(\(\forall x,\ P(x)\)) ≡ \(\exists x,\ \text{non}\,P(x)\)<br>
        non(\(\exists x,\ P(x)\)) ≡ \(\forall x,\ \text{non}\,P(x)\)<br>
        non(\(P\) et \(Q\)) ≡ (non \(P\)) ou (non \(Q\))<br>
        non(\(P \Rightarrow Q\)) ≡ \(P\) et non \(Q\)<br>
        non(\(a < b\)) ≡ \(a \geqslant b\)</div>
      <div class="box ex"><span class="tag">Exemple concret</span>« Tous les élèves ont rendu leur devoir » a pour négation « <i>au moins un</i> élève n’a pas rendu son devoir », et non « aucun élève ne l’a rendu ».</div>
      <div class="box ex"><span class="tag">L’ordre compte</span>« \(\forall x \in \mathbb{R},\ \exists y \in \mathbb{R},\ y > x\) » est vraie (\(y = x + 1\)). « \(\exists y \in \mathbb{R},\ \forall x \in \mathbb{R},\ y > x\) » est fausse.</div>` },
    { titre: "Les types de raisonnement", html: String.raw`
      <div class="box thm"><span class="tag">Méthode · choisir son raisonnement</span>
        <b>Direct</b> : de \(P\) à \(Q\) par déductions.<br>
        <b>Contraposée</b> : quand « non \(Q \Rightarrow\) non \(P\) » est plus simple.<br>
        <b>Absurde</b> : supposer le contraire et trouver une contradiction.<br>
        <b>Contre-exemple</b> : pour montrer qu’un « pour tout » est faux.<br>
        <b>Disjonction de cas</b> : pair/impair, \(x \geqslant 0\) ou \(x < 0\)…</div>
      <div class="box thm"><span class="tag">Théorème · à savoir refaire</span>\(\sqrt{2}\) est irrationnel.<br>
        <i>Démonstration.</i> Supposons \(\sqrt{2} = \frac{p}{q}\), fraction irréductible. Alors \(p^2 = 2q^2\) : \(p^2\) est pair donc \(p\) est pair, \(p = 2k\). Puis \(4k^2 = 2q^2\), soit \(q^2 = 2k^2\) : \(q\) est pair. \(p\) et \(q\) sont divisibles par \(2\) : contradiction avec l’irréductibilité.</div>` },
    { titre: "Fractions, puissances, racines", html: String.raw`
      <div class="box thm"><span class="tag">Règles de calcul</span>\[a^m a^n = a^{m+n},\quad \frac{a^m}{a^n} = a^{m-n},\quad (a^m)^n = a^{mn},\quad a^{-n} = \frac{1}{a^n}\]
        Pour \(a, b \geqslant 0\) : \(\sqrt{ab} = \sqrt{a}\sqrt{b}\). Pour tout réel \(x\) : \(\sqrt{x^2} = |x|\).</div>
      <div class="box ex"><span class="tag">Piège classique</span>\(\sqrt{a+b} \neq \sqrt{a} + \sqrt{b}\) : \(\sqrt{9+16} = 5\) mais \(\sqrt{9} + \sqrt{16} = 7\). De même \((a+b)^2 \neq a^2 + b^2\).</div>
      <div class="box thm"><span class="tag">Identités remarquables</span>\[(a+b)^2 = a^2 + 2ab + b^2,\quad (a-b)^2 = a^2 - 2ab + b^2,\quad (a+b)(a-b) = a^2 - b^2\]</div>` },
    { titre: "Inégalités et valeur absolue", html: String.raw`
      <div class="box thm"><span class="tag">Règles · si \(a \leqslant b\)</span>
        \(a + c \leqslant b + c\).<br>
        Multiplier par \(c > 0\) conserve le sens ; par \(c < 0\), <b>il change</b>.<br>
        On additionne deux inégalités de même sens, on ne les soustrait pas.<br>
        Si \(0 \leqslant a \leqslant b\), alors \(a^2 \leqslant b^2\). Si \(0 < a \leqslant b\), alors \(\frac{1}{a} \geqslant \frac{1}{b}\).</div>
      <div class="box def"><span class="tag">Valeur absolue</span>\(|x| = x\) si \(x \geqslant 0\), \(|x| = -x\) sinon. \(|x - a|\) est la distance entre \(x\) et \(a\) : \(|x - 3| \leqslant 2 \iff x \in [1;5]\).</div>
      <div class="box thm"><span class="tag">Méthode · comparer A et B</span>Étudier le signe de \(A - B\) : factoriser, puis tableau de signes.</div>` }
  ],
  exercices: [
    { titre: "Réciproque et contre-exemple", genre: "Logique", niveau: 1, source: "", enonce: String.raw`Dire si chaque phrase est vraie, puis étudier sa réciproque. a) Pour tout réel \(x\), si \(x > 3\) alors \(x^2 > 9\). b) Pour tout entier \(n\), si \(6\) divise \(n\) alors \(3\) divise \(n\).`,
      corrige: String.raw`<p><b>a)</b> Soit \(x\) un réel tel que \(x > 3\). Alors \(x > 0\) ; la fonction carré étant strictement croissante sur \([0 ; +\infty[\), on obtient \(x^2 > 3^2 = 9\). L’implication est vraie pour tout réel \(x\).</p>
        <p>Réciproque : « pour tout réel \(x\), si \(x^2 > 9\) alors \(x > 3\) ». Elle est fausse : pour \(x = -4\), on a \(x^2 = 16 > 9\) mais \(-4 \leqslant 3\). Ce contre-exemple suffit.</p>
        <p><b>b)</b> Soit \(n\) un entier divisible par \(6\) : il existe \(k \in \mathbb{Z}\) tel que \(n = 6k\). Alors \(n = 3 \times (2k)\) avec \(2k \in \mathbb{Z}\), donc \(3\) divise \(n\). L’implication est vraie.</p>
        <p>Réciproque : « si \(3\) divise \(n\), alors \(6\) divise \(n\) ». Elle est fausse : \(3\) divise \(3\), mais \(6\) ne divise pas \(3\) puisque \(0 < 3 < 6\).</p>
        <p><b>Conclusion.</b> Les deux implications sont vraies et leurs réciproques sont fausses.</p>`,
      retenir: "Une implication vraie peut avoir une réciproque fausse. Un seul contre-exemple suffit." },
    { titre: "Nier avec deux quantificateurs", genre: "Logique", niveau: 2, source: "Question 4 du diagnostic", enonce: String.raw`Écrire la négation de « pour tout réel \(x\), il existe un entier \(n\) tel que \(n > x\) ». Laquelle est vraie ?`,
      corrige: String.raw`<p>La phrase s’écrit \(\forall x \in \mathbb{R},\ \exists n \in \mathbb{Z},\ n > x\). Sa négation est \[\exists x \in \mathbb{R},\ \forall n \in \mathbb{Z},\ n \leqslant x,\] c’est-à-dire « il existe un réel supérieur ou égal à tous les entiers ».</p>
        <p>Montrons que la phrase de départ est vraie. Soit \(x \in \mathbb{R}\). Notons \(\lfloor x \rfloor\) sa partie entière, l’unique entier tel que \(\lfloor x \rfloor \leqslant x < \lfloor x \rfloor + 1\), et posons \(n = \lfloor x \rfloor + 1\). Alors \(n\) est un entier et \(n > x\).</p>
        <p><b>Conclusion.</b> La phrase est vraie, donc sa négation est fausse.</p>`,
      retenir: "On échange ∀ et ∃ sans changer leur ordre, puis on nie la fin : > devient ⩽." },
    { titre: "Pour tout ou il existe", genre: "Logique", niveau: 1, source: "", enonce: String.raw`Nier, puis dire laquelle est vraie : a) \(\forall n \in \mathbb{N},\ n^2 \geqslant n\). b) \(\exists x \in \mathbb{R},\ x^2 + 1 = 0\).`,
      corrige: String.raw`<p><b>a)</b> Négation : \(\exists n \in \mathbb{N},\ n^2 < n\). Montrons que la proposition initiale est vraie. Soit \(n \in \mathbb{N}\). Si \(n = 0\), alors \(n^2 = 0 \geqslant 0 = n\). Si \(n \geqslant 1\), on multiplie l’inégalité \(n \geqslant 1\) par \(n > 0\), ce qui conserve son sens : \(n^2 \geqslant n\). Dans les deux cas, \(n^2 \geqslant n\).</p>
        <p>La proposition a) est vraie, sa négation est fausse.</p>
        <p><b>b)</b> Négation : \(\forall x \in \mathbb{R},\ x^2 + 1 \neq 0\). Soit \(x \in \mathbb{R}\) : \(x^2 \geqslant 0\), donc \(x^2 + 1 \geqslant 1 > 0\), et en particulier \(x^2 + 1 \neq 0\).</p>
        <p><b>Conclusion.</b> La négation de b) est vraie, donc la proposition b) est fausse.</p>`,
      retenir: "Un « pour tout » se prouve par un raisonnement général ; un « il existe » par un exemple." },
    { titre: "n impair ⇒ n² impair", genre: "Preuve", niveau: 1, source: "Question 5 du diagnostic", enonce: String.raw`Démontrer que si \(n\) est un entier impair, alors \(n^2\) est impair.`,
      corrige: String.raw`<p>Soit \(n\) un entier impair. Par définition, il existe un entier \(k\) tel que \(n = 2k + 1\).</p>
        <p>Alors \[\begin{aligned}n^2 &= (2k + 1)^2 \\ &= 4k^2 + 4k + 1 \\ &= 2(2k^2 + 2k) + 1.\end{aligned}\] Posons \(k' = 2k^2 + 2k\) : c’est un entier, comme somme de produits d’entiers, et \(n^2 = 2k' + 1\).</p>
        <p><b>Conclusion.</b> \(n^2\) est impair.</p>`,
      retenir: "Pair : n = 2k. Impair : n = 2k + 1, avec « il existe un entier k tel que »." },
    { titre: "Contraposée", genre: "Preuve", niveau: 1, source: "", enonce: String.raw`Démontrer que si \(n^2\) est pair, alors \(n\) est pair.`,
      corrige: String.raw`<p>On raisonne par contraposée : il suffit de démontrer que, pour tout entier \(n\), si \(n\) est impair, alors \(n^2\) est impair.</p>
        <p>Soit \(n\) un entier impair : il existe \(k \in \mathbb{Z}\) tel que \(n = 2k + 1\), et \(n^2 = 2(2k^2 + 2k) + 1\) avec \(2k^2 + 2k \in \mathbb{Z}\) (exercice 4). Donc \(n^2\) est impair.</p>
        <p>Une implication et sa contraposée étant équivalentes, l’implication de départ est démontrée.</p>
        <p><b>Conclusion.</b> Pour tout entier \(n\), si \(n^2\) est pair, alors \(n\) est pair.</p>`,
      retenir: "Quand la conclusion est difficile à atteindre, on retourne la phrase." },
    { titre: "Disjonction de cas", genre: "Preuve", niveau: 1, source: "", enonce: String.raw`Démontrer que pour tout entier \(n\), \(n(n+1)\) est pair.`,
      corrige: String.raw`<p>Soit \(n \in \mathbb{Z}\). On distingue deux cas selon la parité de \(n\).</p>
        <p><i>Cas 1 : \(n\) est pair.</i> Il existe \(k \in \mathbb{Z}\) tel que \(n = 2k\). Alors \(n(n+1) = 2\,[k(2k+1)]\) avec \(k(2k+1) \in \mathbb{Z}\) : \(n(n+1)\) est pair.</p>
        <p><i>Cas 2 : \(n\) est impair.</i> Il existe \(k \in \mathbb{Z}\) tel que \(n = 2k + 1\). Alors \(n + 1 = 2(k + 1)\) et \(n(n+1) = 2\,[(2k+1)(k+1)]\) : \(n(n+1)\) est pair.</p>
        <p><b>Conclusion.</b> Les deux cas couvrant tous les entiers, \(n(n+1)\) est pair pour tout entier \(n\).</p>`,
      retenir: "De deux entiers consécutifs, l’un est pair." },
    { titre: "Fractions, puissances, racines", genre: "Calcul", niveau: 1, source: "Question 1 du diagnostic", enonce: String.raw`Simplifier \(A = \frac{2}{3} - \frac{3}{4} \times \frac{2}{9}\), \(B = \frac{2^5 \times 6^{-2}}{4^3 \times 3^{-1}}\), \(C = \sqrt{50} - 3\sqrt{8} + \sqrt{18}\).`,
      corrige: String.raw`<p><b>Calcul de \(A\).</b> La multiplication est prioritaire : \(\frac{3}{4} \times \frac{2}{9} = \frac{6}{36} = \frac{1}{6}\). Donc \[\begin{aligned}A &= \frac{2}{3} - \frac{1}{6} \\ &= \frac{4}{6} - \frac{1}{6} \\ &= \frac{3}{6} \\ &= \frac{1}{2}.\end{aligned}\]</p>
        <p><b>Calcul de \(B\).</b> On décompose en facteurs premiers : \(6^{-2} = 2^{-2} \times 3^{-2}\) et \(4^3 = 2^6\). Ainsi \[\begin{aligned}B &= \frac{2^{5} \times 2^{-2} \times 3^{-2}}{2^{6} \times 3^{-1}} \\ &= 2^{5 - 2 - 6} \times 3^{-2 + 1} \\ &= 2^{-3} \times 3^{-1} \\ &= \frac{1}{24}.\end{aligned}\]</p>
        <p><b>Calcul de \(C\).</b> Pour \(a, b \geqslant 0\), \(\sqrt{ab} = \sqrt{a}\sqrt{b}\) : \(\sqrt{50} = \sqrt{25 \times 2} = 5\sqrt{2}\), \(\sqrt{8} = \sqrt{4 \times 2} = 2\sqrt{2}\), \(\sqrt{18} = \sqrt{9 \times 2} = 3\sqrt{2}\). Donc \(C = 5\sqrt{2} - 6\sqrt{2} + 3\sqrt{2} = 2\sqrt{2}\).</p>
        <p><b>Conclusion.</b> \(A = \frac{1}{2}\), \(B = \frac{1}{24}\) et \(C = 2\sqrt{2}\).</p>`,
      retenir: "Puissances : tout en nombres premiers. Racines : sortir les carrés parfaits." },
    { titre: "Expression conjuguée", genre: "Calcul", niveau: 1, source: "", enonce: String.raw`Écrire \(\frac{1}{\sqrt{3} - 1}\) sans racine au dénominateur.`,
      corrige: String.raw`<p>Le dénominateur est non nul car \(\sqrt{3} \neq 1\). On multiplie le numérateur et le dénominateur par l’expression conjuguée \(\sqrt{3} + 1\), elle aussi non nulle, et on utilise l’identité \((a - b)(a + b) = a^2 - b^2\) :</p>
        <p>\[\begin{aligned}\dfrac{1}{\sqrt{3} - 1} &= \dfrac{\sqrt{3} + 1}{(\sqrt{3} - 1)(\sqrt{3} + 1)} \\ &= \dfrac{\sqrt{3} + 1}{(\sqrt{3})^2 - 1^2} \\ &= \dfrac{\sqrt{3} + 1}{2}.\end{aligned}\]</p>
        <p><b>Conclusion.</b> \(\dfrac{1}{\sqrt{3} - 1} = \dfrac{\sqrt{3} + 1}{2}\).</p>`,
      retenir: "(√a − b)(√a + b) = a − b² fait disparaître la racine." },
    { titre: "Pourcentages successifs", genre: "Situation concrète", niveau: 1, source: "Vrai–Faux 2026, question 1", enonce: String.raw`Un prix augmente de \(20\,\%\) puis baisse de \(20\,\%\) : évolution globale ? Avec \(+19\,\%\) par an pendant 4 ans, a-t-il plus que doublé ?`,
      corrige: String.raw`<p>Notons \(P_0 > 0\) le prix initial. Une hausse de \(20\,\%\) revient à multiplier par \(1 + \frac{20}{100} = 1{,}2\) ; une baisse de \(20\,\%\), à multiplier par \(1 - \frac{20}{100} = 0{,}8\). Le prix final est donc \(P_0 \times 1{,}2 \times 0{,}8 = 0{,}96\,P_0\). Comme \(0{,}96 = 1 - 0{,}04\), le prix a baissé de \(4\,\%\).</p>
        <p>Quatre hausses de \(19\,\%\) multiplient le prix par \(1{,}19^4\). Or \(1{,}19^2 = 1{,}4161\), donc \(1{,}19^4 = 1{,}4161^2 > 1{,}416^2 = 2{,}005\,056 > 2\).</p>
        <p><b>Conclusion.</b> L’évolution globale est une baisse de \(4\,\%\) ; avec \(+19\,\%\) par an pendant 4 ans, le prix a bien plus que doublé, de justesse.</p>`,
      retenir: "Les pourcentages successifs se multiplient." },
    { titre: "Inégalités piégées", genre: "Vrai–Faux", niveau: 2, source: "Vrai–Faux 2026, questions 5 et 6", enonce: String.raw`Vrai ou faux ? a) Les réels tels que \(4 \leqslant x^2 \leqslant 9\) sont ceux de \([2;3]\). b) Pour \(a, b\) non nuls, si \(a \geqslant 2b\) alors \(a^2 \geqslant 2ab\).`,
      corrige: String.raw`<p><b>a) Faux.</b> Pour \(x = -2{,}5\), on a \(x^2 = 6{,}25\), donc \(4 \leqslant x^2 \leqslant 9\), mais \(-2{,}5 \notin [2 ; 3]\).</p>
        <p>Ensemble exact : pour tout réel \(x\), \(x^2 = |x|^2\), et la fonction carré est strictement croissante sur \([0 ; +\infty[\), donc \[\begin{aligned}4 \leqslant x^2 \leqslant 9 &\iff 2 \leqslant |x| \leqslant 3 \\ &\iff x \in [-3 ; -2] \cup [2 ; 3].\end{aligned}\]</p>
        <p><b>b) Faux.</b> Prenons \(a = b = -2\), non nuls. On a \(a = -2 \geqslant -4 = 2b\), mais \(a^2 = 4\) et \(2ab = 8\), donc \(a^2 < 2ab\).</p>
        <p>L’erreur serait de multiplier \(a \geqslant 2b\) par \(a\) sans regarder son signe : ici \(a < 0\), ce qui change le sens de l’inégalité.</p>`,
      retenir: "Vérifier le signe du multiplicateur. Penser aux négatifs pour un contre-exemple." },
    { titre: "Un carré est positif", genre: "Preuve", niveau: 2, source: "", enonce: String.raw`Démontrer que \(a^2 + b^2 \geqslant 2ab\), puis que \(x + \frac{1}{x} \geqslant 2\) pour \(x > 0\).`,
      corrige: String.raw`<p>Soient \(a\) et \(b\) deux réels. On étudie le signe de la différence : \(a^2 + b^2 - 2ab = (a - b)^2 \geqslant 0\), car un carré est positif. Donc \(a^2 + b^2 \geqslant 2ab\), avec égalité si et seulement si \(a = b\).</p>
        <p>Soit \(x > 0\). En réduisant au même dénominateur : \[\begin{aligned}x + \frac{1}{x} - 2 &= \frac{x^2 - 2x + 1}{x} \\ &= \frac{(x - 1)^2}{x}.\end{aligned}\] Le numérateur est positif ou nul et le dénominateur strictement positif, donc ce quotient est positif ou nul.</p>
        <p><b>Conclusion.</b> Pour tout \(x > 0\), \(x + \frac{1}{x} \geqslant 2\), avec égalité si et seulement si \(x = 1\).</p>`,
      retenir: "Beaucoup d’inégalités viennent d’un carré positif." },
    { titre: "Table de vérité de l’implication", genre: "Logique", niveau: 1, source: "", enonce: String.raw`Dresser la table de vérité de « (non \(P\)) ou \(Q\) » et la comparer à celle de \(P \Rightarrow Q\). En déduire, sans table, la négation de \(P \Rightarrow Q\).`,
      corrige: String.raw`<p>On dresse la table en écrivant toutes les colonnes intermédiaires :</p><table class="tv"><tr><th>P</th><th>Q</th><th>non P</th><th>(non P) ou Q</th><th>P ⇒ Q</th></tr><tr><td>V</td><td>V</td><td>F</td><td>V</td><td>V</td></tr><tr><td>V</td><td>F</td><td>F</td><td class="f">F</td><td class="f">F</td></tr><tr><td>F</td><td>V</td><td>V</td><td>V</td><td>V</td></tr><tr><td>F</td><td>F</td><td>V</td><td>V</td><td>V</td></tr></table><p>Les deux dernières colonnes coïncident ligne à ligne : les propositions « (non P) ou Q » et « P ⇒ Q » sont équivalentes.</p>
        <p><b>Négation.</b> D’après la loi de De Morgan, non((non P) ou Q) ≡ (non(non P)) et (non Q) ≡ P et (non Q). On le vérifie sur une seconde table :</p><table class="tv"><tr><th>P</th><th>Q</th><th>non Q</th><th>P et (non Q)</th><th>non(P ⇒ Q)</th></tr><tr><td>V</td><td>V</td><td>F</td><td>F</td><td>F</td></tr><tr><td>V</td><td>F</td><td>V</td><td>V</td><td>V</td></tr><tr><td>F</td><td>V</td><td>F</td><td>F</td><td>F</td></tr><tr><td>F</td><td>F</td><td>V</td><td>F</td><td>F</td></tr></table><p><b>Conclusion.</b> P ⇒ Q ≡ (non P) ou Q, et non(P ⇒ Q) ≡ P et (non Q) : la négation d’une implication est une conjonction, pas une implication.</p>`,
      retenir: "P ⇒ Q ≡ (non P) ou Q ; sa négation est « P et non Q »." },
    { titre: "Le règlement des retards", genre: "Situation concrète", niveau: 1, source: "", enonce: String.raw`Le règlement d’un collège dit : « Si un élève a plus de trois retards dans le mois, alors il est convoqué. » En octobre : Ali a 5 retards et n’est pas convoqué ; Bina a 1 retard et est convoquée ; Chaïma n’a aucun retard et n’est pas convoquée ; Dayan a 4 retards et est convoqué. a) Quel cas contredit le règlement ? b) Écrire la réciproque et la contraposée en français. Laquelle dit la même chose que le règlement ?`,
      corrige: String.raw`<p>Notons \(P\) : « l’élève a plus de trois retards dans le mois » et \(Q\) : « l’élève est convoqué ». Le règlement est l’implication \(P \Rightarrow Q\), fausse seulement si \(P\) est vraie et \(Q\) fausse :</p><table class="tv"><tr><th>Élève</th><th>P</th><th>Q</th><th>P ⇒ Q</th></tr><tr><td>Ali</td><td>V</td><td>F</td><td class="f">F</td></tr><tr><td>Bina</td><td>F</td><td>V</td><td>V</td></tr><tr><td>Chaïma</td><td>F</td><td>F</td><td>V</td></tr><tr><td>Dayan</td><td>V</td><td>V</td><td>V</td></tr></table><p><b>a)</b> Seul le cas d’Ali contredit le règlement. Bina ne le contredit pas : l’hypothèse étant fausse, l’implication est vraie (elle peut être convoquée pour une autre raison).</p>
        <p><b>b)</b> Réciproque (\(Q \Rightarrow P\)) : « si un élève est convoqué, alors il a plus de trois retards » ; le cas de Bina montre qu’elle ne découle pas du règlement. Contraposée (non \(Q \Rightarrow\) non \(P\)) : « si un élève n’est pas convoqué, alors il a au plus trois retards ».</p>
        <p><b>Conclusion.</b> La contraposée est équivalente au règlement ; la réciproque ne l’est pas.</p>`,
      retenir: "Une règle « si…, alors… » n’est violée que par un cas « hypothèse vraie, conclusion fausse »." },
    { titre: "Condition nécessaire, condition suffisante", genre: "Logique", niveau: 2, source: "", enonce: String.raw`Compléter par « nécessaire », « suffisante » ou « nécessaire et suffisante », en justifiant. a) \(x > 2\) est une condition … pour que \(x^2 > 4\). b) Être un rectangle est une condition … pour qu’un quadrilatère soit un carré. c) Pour un entier \(n\), être divisible par \(6\) est une condition … pour être pair et divisible par \(3\). d) \(a = 0\) est une condition … pour que \(ab = 0\).`,
      corrige: String.raw`<p>Rappel : « \(P\) est une condition suffisante pour \(Q\) » signifie \(P \Rightarrow Q\) ; « \(P\) est une condition nécessaire pour \(Q\) » signifie \(Q \Rightarrow P\).</p>
        <p><b>a) Suffisante, non nécessaire.</b> Si \(x > 2\), alors \(x > 0\) et, la fonction carré étant strictement croissante sur \([0 ; +\infty[\), \(x^2 > 4\). La condition n’est pas nécessaire : \(x = -3\) vérifie \(x^2 = 9 > 4\) sans vérifier \(x > 2\).</p>
        <p><b>b) Nécessaire, non suffisante.</b> Un carré a quatre angles droits, c’est donc un rectangle : « carré ⇒ rectangle ». En revanche, un rectangle de dimensions \(2 \times 1\) n’est pas un carré.</p>
        <p><b>c) Nécessaire et suffisante.</b> Si \(6\) divise \(n\), il existe \(k \in \mathbb{Z}\) tel que \(n = 6k = 2(3k) = 3(2k)\) : \(n\) est pair et divisible par \(3\). Réciproquement, supposons \(n\) pair et divisible par \(3\) : il existe \(c \in \mathbb{Z}\) tel que \(n = 3c\). Si \(c\) était impair, \(3c\) serait impair (produit de deux impairs), ce qui contredit la parité de \(n\). Donc \(c\) est pair, \(c = 2b\) avec \(b \in \mathbb{Z}\), et \(n = 6b\).</p>
        <p><b>d) Suffisante, non nécessaire.</b> Si \(a = 0\), alors \(ab = 0\). La condition n’est pas nécessaire : \(a = 1\) et \(b = 0\) donnent \(ab = 0\) avec \(a \neq 0\).</p>`,
      retenir: "« P suffit pour Q » : P ⇒ Q. « P est nécessaire pour Q » : Q ⇒ P." },
    { titre: "On ne divise pas par x", genre: "Erreur d’élève", niveau: 1, source: "", enonce: String.raw`Un élève résout \(x^2 = 3x\) ainsi : « je divise par \(x\), donc \(x = 3\) ». Repérer l’erreur, résoudre correctement, puis proposer une phrase à dire à l’élève.`,
      corrige: String.raw`<p><b>L’erreur.</b> Diviser les deux membres par \(x\) n’est permis que si \(x \neq 0\). L’élève écarte donc sans le dire la valeur \(x = 0\), qui est justement une solution.</p>
        <p><b>Résolution.</b> Pour tout réel \(x\) : \[x^2 = 3x \iff x^2 - 3x = 0 \iff x(x - 3) = 0.\] Un produit de facteurs est nul si et seulement si l’un au moins des facteurs est nul, donc \(x(x - 3) = 0 \iff x = 0 \text{ ou } x = 3\).</p>
        <p><b>Conclusion.</b> \(S = \{0 ; 3\}\).</p>
        <p><b>À dire à l’élève.</b> « On ne divise que par un nombre dont on est sûr qu’il n’est pas nul. Ici, regroupe tout dans un membre et factorise. »</p>`,
      retenir: "Avant de diviser par une expression, vérifier qu’elle n’est pas nulle ; sinon, factoriser." },
    { titre: "Somme de deux impairs : deux copies", genre: "Erreur d’élève", niveau: 1, source: "", enonce: String.raw`On demande de démontrer que la somme de deux entiers impairs est paire. Copie 1 : « \(3 + 5 = 8\), \(7 + 9 = 16\), \(11 + 1 = 12\) : c’est toujours pair. » Copie 2 : « \(n = 2k + 1\) et \(p = 2k + 1\), donc \(n + p = 4k + 2 = 2(2k + 1)\) : pair. » Dire ce qui ne va pas dans chaque copie et rédiger une preuve correcte.`,
      corrige: String.raw`<p><b>Copie 1.</b> Elle vérifie la propriété sur trois exemples. Des exemples permettent de conjecturer, jamais de démontrer une propriété portant sur une infinité d’entiers.</p>
        <p><b>Copie 2.</b> En écrivant \(n = 2k + 1\) et \(p = 2k + 1\) avec la même lettre \(k\), elle impose \(n = p\) : elle ne traite que la somme d’un impair avec lui-même.</p>
        <p><b>Preuve.</b> Soient \(n\) et \(p\) deux entiers impairs. Il existe des entiers \(k\) et \(m\) tels que \(n = 2k + 1\) et \(p = 2m + 1\). Alors \(n + p = 2k + 2m + 2 = 2(k + m + 1)\), et \(k + m + 1\) est un entier.</p>
        <p><b>Conclusion.</b> La somme de deux entiers impairs est paire.</p>`,
      retenir: "Deux nombres quelconques : deux lettres différentes (k et m)." },
    { titre: "Nier des phrases du quotidien", genre: "Logique", niveau: 1, source: "", enonce: String.raw`Écrire la négation de chaque phrase, sans commencer par « il est faux que ». a) « Dans chaque classe du collège, un élève au moins parle shimaoré. » b) « Il existe un professeur qui connaît le prénom de tous ses élèves. » c) « S’il pleut, le match est annulé. » d) « Tous les bus partent à l’heure et arrivent à l’heure. »`,
      corrige: String.raw`<p>Règles utilisées : « pour tout » devient « il existe », « il existe » devient « pour tout », « et » devient « ou », et non(\(P \Rightarrow Q\)) ≡ \(P\) et non \(Q\).</p>
        <p><b>a)</b> Structure : pour toute classe, il existe un élève de cette classe qui parle shimaoré. Négation : <i>il existe une classe du collège dans laquelle aucun élève ne parle shimaoré.</i></p>
        <p><b>b)</b> Structure : il existe un professeur tel que, pour tout élève de ce professeur, il connaît son prénom. Négation : <i>tout professeur a au moins un élève dont il ne connaît pas le prénom.</i></p>
        <p><b>c)</b> Structure : implication « il pleut ⇒ le match est annulé ». Négation : <i>il pleut et le match n’est pas annulé.</i></p>
        <p><b>d)</b> Structure : pour tout bus, (il part à l’heure et il arrive à l’heure). Négation : <i>il existe un bus qui part en retard ou qui arrive en retard.</i></p>`,
      retenir: "« Chaque » devient « il existe », « et » devient « ou », « si P alors Q » devient « P et non Q »." },
    { titre: "L’ordre des quantificateurs : être majorée", genre: "Logique", niveau: 3, source: "", enonce: String.raw`Soit \(f\) une fonction définie sur \(\mathbb{R}\). On considère (A) : \(\exists M \in \mathbb{R},\ \forall x \in \mathbb{R},\ f(x) \leqslant M\) et (B) : \(\forall x \in \mathbb{R},\ \exists M \in \mathbb{R},\ f(x) \leqslant M\). a) Traduire chaque phrase en français. b) Montrer que (B) est vraie pour toute fonction \(f\). c) Montrer que \(f(x) = x\) ne vérifie pas (A).`,
      corrige: String.raw`<p><b>a)</b> (A) : « il existe un réel \(M\) tel que, pour tout réel \(x\), \(f(x) \leqslant M\) ». Un même nombre \(M\) est au-dessus de toutes les valeurs de \(f\) : c’est la définition de « \(f\) est majorée sur \(\mathbb{R}\) ». (B) : « pour tout réel \(x\), il existe un réel \(M\) tel que \(f(x) \leqslant M\) » ; ici \(M\) peut dépendre de \(x\).</p>
        <p><b>b)</b> Soit \(x \in \mathbb{R}\). Posons \(M = f(x)\) : on a bien \(f(x) \leqslant M\). Donc (B) est vraie pour toute fonction \(f\) définie sur \(\mathbb{R}\).</p>
        <p><b>c)</b> Ici \(f(x) = x\). La négation de (A) est \[\forall M \in \mathbb{R},\ \exists x \in \mathbb{R},\ f(x) > M.\] Soit \(M \in \mathbb{R}\) ; posons \(x = M + 1\). Alors \(f(x) = M + 1 > M\). La négation de (A) est vraie, donc (A) est fausse.</p>
        <p><b>Conclusion.</b> La fonction \(x \mapsto x\) vérifie (B) mais pas (A) : échanger \(\exists\) et \(\forall\) change le sens de la phrase.</p>`,
      retenir: "Dans « ∃M ∀x », M ne dépend pas de x ; dans « ∀x ∃M », il peut en dépendre." },
    { titre: "Absurde et parité", genre: "Preuve", niveau: 1, source: "", enonce: String.raw`Démontrer par l’absurde qu’il n’existe pas d’entiers \(a\) et \(b\) tels que \(2a + 4b = 7\). Application : des gâteaux sont vendus en boîtes de \(2\) et de \(4\). Peut-on en acheter exactement \(7\) ?`,
      corrige: String.raw`<p>Raisonnons par l’absurde : supposons qu’il existe deux entiers \(a\) et \(b\) tels que \(2a + 4b = 7\).</p>
        <p>Alors \(7 = 2(a + 2b)\), où \(a + 2b\) est un entier : \(7\) serait pair. Or \(7 = 2 \times 3 + 1\) est impair. C’est une contradiction.</p>
        <p><b>Conclusion.</b> Il n’existe pas d’entiers \(a\) et \(b\) tels que \(2a + 4b = 7\).</p>
        <p><b>Application.</b> Avec \(a\) boîtes de \(2\) et \(b\) boîtes de \(4\), on obtient \(2a + 4b\) gâteaux, qui ne peut pas valoir \(7\) d’après ce qui précède : c’est impossible.</p>`,
      retenir: "Absurde : supposer le contraire, dérouler, tomber sur une phrase fausse." },
    { titre: "Rationnel plus irrationnel", genre: "Preuve", niveau: 2, source: "", enonce: String.raw`Soit \(r\) un rationnel et \(x\) un irrationnel. a) Démontrer que \(r + x\) est irrationnel. b) Si de plus \(r \neq 0\), démontrer que \(rx\) est irrationnel. c) En déduire que \(3 + 2\sqrt{2}\) est irrationnel.`,
      corrige: String.raw`<p><b>a)</b> Raisonnons par l’absurde et supposons \(r + x\) rationnel ; notons \(q = r + x \in \mathbb{Q}\). Alors \(x = q - r\) est une différence de deux rationnels, donc un rationnel, ce qui contredit l’hypothèse « \(x\) irrationnel ». Donc \(r + x\) est irrationnel.</p>
        <p><b>b)</b> Supposons \(r \neq 0\) et, par l’absurde, \(rx\) rationnel ; notons \(q = rx \in \mathbb{Q}\). Comme \(r \neq 0\), \(x = \frac{q}{r}\) est le quotient d’un rationnel par un rationnel non nul, donc un rationnel. Contradiction : \(rx\) est irrationnel.</p>
        <p><b>c)</b> On sait que \(\sqrt{2}\) est irrationnel (cours). D’après b) avec \(r = 2 \neq 0\), \(2\sqrt{2}\) est irrationnel ; d’après a) avec \(r = 3\), \(3 + 2\sqrt{2}\) est irrationnel.</p>
        <p><b>Conclusion.</b> \(3 + 2\sqrt{2}\) est irrationnel.</p>`,
      retenir: "Les rationnels sont stables par +, −, ×, ÷ (non nul) : c’est le moteur de ces absurdes." },
    { titre: "Treize personnes, douze mois", genre: "Situation concrète", niveau: 1, source: "", enonce: String.raw`a) Démontrer que dans un groupe de \(13\) personnes, deux au moins sont nées le même mois. b) Combien d’élèves faut-il au minimum dans une classe pour être sûr que deux d’entre eux ont la même initiale de prénom (26 lettres) ?`,
      corrige: String.raw`<p><b>a)</b> Raisonnons par l’absurde : supposons que les \(13\) personnes soient nées des mois deux à deux distincts. Il faudrait alors \(13\) mois différents, alors qu’une année n’en compte que \(12\). C’est une contradiction.</p>
        <p>Donc deux personnes au moins sont nées le même mois.</p>
        <p><b>b)</b> Avec \(26\) élèves, on ne peut pas conclure : les initiales peuvent être toutes différentes, une par lettre. Avec \(27\) élèves, si les initiales étaient deux à deux distinctes, il faudrait \(27\) lettres, or l’alphabet en compte \(26\) : contradiction.</p>
        <p><b>Conclusion.</b> Il faut au minimum \(27\) élèves.</p>`,
      retenir: "Principe des tiroirs : n + 1 objets dans n tiroirs, un tiroir en contient au moins deux." },
    { titre: "n³ − n est multiple de 3", genre: "Preuve", niveau: 2, source: "", enonce: String.raw`Démontrer que pour tout entier \(n\), \(n^3 - n\) est divisible par \(3\), de deux façons : a) en factorisant ; b) en distinguant les restes de \(n\) dans la division par \(3\).`,
      corrige: String.raw`<p>Soit \(n \in \mathbb{Z}\). On a \(n^3 - n = n(n^2 - 1) = (n - 1)\,n\,(n + 1)\).</p>
        <p><b>a)</b> \((n - 1)n(n + 1)\) est le produit de trois entiers consécutifs. Parmi trois entiers consécutifs, l’un est multiple de \(3\) (c’est ce que précise la méthode b). Le produit est donc multiple de \(3\).</p>
        <p><b>b)</b> D’après la division euclidienne par \(3\), il existe \(k \in \mathbb{Z}\) tel que \(n = 3k\), \(n = 3k + 1\) ou \(n = 3k + 2\).<br>
        <i>Si \(n = 3k\)</i> : le facteur \(n\) est multiple de \(3\).<br>
        <i>Si \(n = 3k + 1\)</i> : le facteur \(n - 1 = 3k\) est multiple de \(3\).<br>
        <i>Si \(n = 3k + 2\)</i> : le facteur \(n + 1 = 3(k + 1)\) est multiple de \(3\).<br>
        Dans chaque cas, un facteur du produit est multiple de \(3\), donc le produit aussi.</p>
        <p><b>Conclusion.</b> Pour tout entier \(n\), \(3\) divise \(n^3 - n\).</p>`,
      retenir: "Divisibilité par 3 : trois cas, n = 3k, 3k + 1 ou 3k + 2." },
    { titre: "Somme de deux distances", genre: "Calcul", niveau: 3, source: "", enonce: String.raw`Résoudre dans \(\mathbb{R}\) : \(|x - 2| + |x + 1| = 5\). Interpréter sur une droite graduée.`,
      corrige: String.raw`<p>Les expressions \(x - 2\) et \(x + 1\) changent de signe en \(2\) et en \(-1\). On résout l’équation sur chacun des trois intervalles ainsi délimités.</p>
        <p><i>Si \(x < -1\)</i> : \(x - 2 < 0\) et \(x + 1 < 0\), donc l’équation s’écrit \(-(x - 2) - (x + 1) = 5\), soit \(-2x + 1 = 5\), d’où \(x = -2\). Comme \(-2 < -1\), cette valeur convient.</p>
        <p><i>Si \(-1 \leqslant x \leqslant 2\)</i> : \(x - 2 \leqslant 0\) et \(x + 1 \geqslant 0\), donc l’équation s’écrit \(-(x - 2) + (x + 1) = 5\), soit \(3 = 5\) : aucune solution dans cet intervalle.</p>
        <p><i>Si \(x > 2\)</i> : l’équation s’écrit \((x - 2) + (x + 1) = 5\), soit \(2x - 1 = 5\), d’où \(x = 3\), qui vérifie bien \(x > 2\).</p>
        <p><b>Conclusion.</b> \(S = \{-2 ; 3\}\).</p>
        <p><b>Interprétation.</b> \(|x - 2| + |x + 1|\) est la somme des distances de \(x\) aux points \(2\) et \(-1\). Entre ces points, elle vaut toujours \(3\), la longueur du segment ; pour obtenir \(5\), il faut sortir du segment de \(1\) d’un côté ou de l’autre.</p>`,
      retenir: "Valeurs absolues : découper selon le signe de chaque expression, et vérifier que la solution est dans le cas." },
    { titre: "Distances et intervalles", genre: "Calcul", niveau: 1, source: "", enonce: String.raw`a) Écrire \(x \in [1 ; 7]\) avec une valeur absolue. b) Résoudre \(|2x + 3| < 5\). c) Résoudre \(|x + 1| \geqslant 2\).`,
      corrige: String.raw`<p><b>a)</b> L’intervalle \([1 ; 7]\) a pour centre \(\frac{1 + 7}{2} = 4\) et pour rayon \(\frac{7 - 1}{2} = 3\). Donc \(x \in [1 ; 7] \iff |x - 4| \leqslant 3\).</p>
        <p><b>b)</b> Pour tout réel \(x\) : \[\begin{aligned}|2x + 3| < 5 &\iff -5 < 2x + 3 < 5 \\ &\iff -8 < 2x < 2 \\ &\iff -4 < x < 1,\end{aligned}\] en retranchant \(3\) puis en divisant par \(2 > 0\). Donc \(S = \,]-4 ; 1[\).</p>
        <p><b>c)</b> \(|x + 1| = |x - (-1)|\) est la distance de \(x\) à \(-1\). Pour tout réel \(x\) : \[\begin{aligned}|x + 1| \geqslant 2 &\iff x + 1 \leqslant -2 \text{ ou } x + 1 \geqslant 2 \\ &\iff x \leqslant -3 \text{ ou } x \geqslant 1.\end{aligned}\] Donc \(S = \,]-\infty ; -3] \cup [1 ; +\infty[\).</p>`,
      retenir: "|x − a| ⩽ r : intervalle de centre a et de rayon r. « ⩾ » donne une réunion de deux intervalles." },
    { titre: "Factoriser avec les identités", genre: "Calcul", niveau: 1, source: "", enonce: String.raw`Factoriser \(A = (2x + 1)^2 - (x - 3)^2\), \(B = x^3 - 4x\), \(C = 9x^2 - 12x + 4\). Résoudre ensuite \(A = 0\).`,
      corrige: String.raw`<p>\(A\) est une différence de deux carrés \(a^2 - b^2\) avec \(a = 2x + 1\) et \(b = x - 3\). D’après \(a^2 - b^2 = (a - b)(a + b)\) : \[\begin{aligned}A &= \big[(2x + 1) - (x - 3)\big]\big[(2x + 1) + (x - 3)\big] \\ &= (x + 4)(3x - 2).\end{aligned}\]</p>
        <p>\[\begin{aligned}B &= x(x^2 - 4) \\ &= x(x^2 - 2^2) \\ &= x(x - 2)(x + 2).\end{aligned}\]</p>
        <p>\(C = (3x)^2 - 2 \times (3x) \times 2 + 2^2\) est de la forme \(a^2 - 2ab + b^2 = (a - b)^2\) : \(C = (3x - 2)^2\).</p>
        <p>Un produit est nul si et seulement si l’un de ses facteurs est nul : \[\begin{aligned}A = 0 &\iff x + 4 = 0 \text{ ou } 3x - 2 = 0 \\ &\iff x = -4 \text{ ou } x = \frac{2}{3}.\end{aligned}\]</p>
        <p><b>Conclusion.</b> \(A = (x + 4)(3x - 2)\), \(B = x(x - 2)(x + 2)\), \(C = (3x - 2)^2\), et l’équation \(A = 0\) a pour ensemble de solutions \(\left\{-4 ; \frac{2}{3}\right\}\).</p>`,
      retenir: "Une différence de deux carrés se factorise toujours : a² − b² = (a − b)(a + b)." },
    { titre: "Calcul mental avec les identités", genre: "Calcul", niveau: 1, source: "", enonce: String.raw`Sans poser d’opération : \(101^2\), \(99 \times 101\), \(1001^2 - 999^2\), \(48 \times 52\).`,
      corrige: String.raw`<p>On utilise les identités remarquables.</p>
        <p>\[\begin{aligned}101^2 &= (100 + 1)^2 \\ &= 100^2 + 2 \times 100 \times 1 + 1^2 \\ &= 10\,000 + 200 + 1 \\ &= 10\,201.\end{aligned}\]</p>
        <p>\[\begin{aligned}99 \times 101 &= (100 - 1)(100 + 1) \\ &= 100^2 - 1^2 = 9\,999.\end{aligned}\]</p>
        <p>\[\begin{aligned}1001^2 - 999^2 &= (1001 - 999)(1001 + 999) \\ &= 2 \times 2000 \\ &= 4000.\end{aligned}\]</p>
        <p>\[\begin{aligned}48 \times 52 &= (50 - 2)(50 + 2) \\ &= 50^2 - 2^2 \\ &= 2500 - 4 \\ &= 2496.\end{aligned}\]</p>`,
      retenir: "Les identités remarquables sont aussi des outils de calcul mental, utiles pour les motiver en classe." },
    { titre: "Une somme qui se télescope", genre: "Calcul", niveau: 2, source: "", enonce: String.raw`a) Pour \(x \notin \{0 ; -1\}\), réduire \(\frac{1}{x} - \frac{1}{x+1}\). b) En déduire \(S = \frac{1}{1 \times 2} + \frac{1}{2 \times 3} + \cdots + \frac{1}{99 \times 100}\).`,
      corrige: String.raw`<p><b>a)</b> Soit \(x \notin \{0 ; -1\}\), de sorte que \(x\) et \(x + 1\) sont non nuls. En réduisant au même dénominateur : \[\begin{aligned}\frac{1}{x} - \frac{1}{x + 1} &= \frac{(x + 1) - x}{x(x + 1)} \\ &= \frac{1}{x(x + 1)}.\end{aligned}\]</p>
        <p><b>b)</b> D’après a), pour tout entier \(k\) compris entre \(1\) et \(99\), \(\frac{1}{k(k + 1)} = \frac{1}{k} - \frac{1}{k + 1}\). Donc</p>
        <p>\[S = \left(\frac{1}{1} - \frac{1}{2}\right) + \left(\frac{1}{2} - \frac{1}{3}\right) + \cdots + \left(\frac{1}{99} - \frac{1}{100}\right).\]</p>
        <p>Chaque terme \(-\frac{1}{k + 1}\) s’annule avec le terme \(+\frac{1}{k + 1}\) de la parenthèse suivante ; il ne reste que le premier et le dernier terme : \(S = 1 - \frac{1}{100}\).</p>
        <p><b>Conclusion.</b> \(S = \frac{99}{100}\).</p>`,
      retenir: "Écrire chaque terme comme une différence a(k) − a(k+1) : la somme vaut a(premier) − a(dernier + 1)." },
    { titre: "Comparer des puissances", genre: "Calcul", niveau: 2, source: "", enonce: String.raw`Sans calculatrice, comparer : a) \(2^{30}\) et \(3^{20}\) ; b) \(2^{40}\) et \(10^{12}\) ; c) \(5^{300}\) et \(3^{500}\).`,
      corrige: String.raw`<p>Pour tout entier \(n \geqslant 1\), la fonction \(t \mapsto t^n\) est strictement croissante sur \([0 ; +\infty[\) : si \(0 \leqslant a < b\), alors \(a^n < b^n\). On ramène donc chaque comparaison à un même exposant.</p>
        <p><b>a)</b> \(2^{30} = (2^3)^{10} = 8^{10}\) et \(3^{20} = (3^2)^{10} = 9^{10}\). Comme \(0 \leqslant 8 < 9\), on a \(2^{30} < 3^{20}\).</p>
        <p><b>b)</b> \(2^{40} = (2^{10})^4 = 1024^4\) et \(10^{12} = (10^3)^4 = 1000^4\). Comme \(0 \leqslant 1000 < 1024\), on a \(10^{12} < 2^{40}\).</p>
        <p><b>c)</b> \(5^{300} = (5^3)^{100} = 125^{100}\) et \(3^{500} = (3^5)^{100} = 243^{100}\). Comme \(0 \leqslant 125 < 243\), on a \(5^{300} < 3^{500}\).</p>`,
      retenir: "Ramener à un même exposant, puis comparer les bases positives (x ↦ xⁿ est croissante sur [0 ; +∞[)." },
    { titre: "Racines emboîtées", genre: "Calcul", niveau: 2, source: "", enonce: String.raw`Démontrer que \(\sqrt{3 + 2\sqrt{2}} = 1 + \sqrt{2}\) et que \(\sqrt{7 - 4\sqrt{3}} = 2 - \sqrt{3}\). Pourquoi faut-il vérifier un signe ?`,
      corrige: String.raw`<p>Rappel : pour \(a \geqslant 0\), \(\sqrt{a}\) est l’unique réel <b>positif</b> dont le carré vaut \(a\). Ainsi, pour tout réel \(b\) : \(\sqrt{a} = b \iff (b \geqslant 0 \text{ et } b^2 = a)\).</p>
        <p>D’une part \(1 + \sqrt{2} \geqslant 0\) ; d’autre part \((1 + \sqrt{2})^2 = 1 + 2\sqrt{2} + 2 = 3 + 2\sqrt{2}\). Donc \(\sqrt{3 + 2\sqrt{2}} = 1 + \sqrt{2}\).</p>
        <p>D’une part \(3 < 4\) et la racine carrée est croissante, donc \(\sqrt{3} < 2\), soit \(2 - \sqrt{3} > 0\) ; d’autre part \((2 - \sqrt{3})^2 = 4 - 4\sqrt{3} + 3 = 7 - 4\sqrt{3}\). Donc \(\sqrt{7 - 4\sqrt{3}} = 2 - \sqrt{3}\).</p>
        <p><b>Pourquoi vérifier le signe.</b> \((\sqrt{3} - 2)^2\) vaut aussi \(7 - 4\sqrt{3}\), mais \(\sqrt{3} - 2 < 0\) ne peut pas être une racine carrée. Seule la condition de signe permet de choisir entre \(2 - \sqrt{3}\) et \(\sqrt{3} - 2\).</p>`,
      retenir: "√a = b ⇔ (b ⩾ 0 et b² = a)." },
    { titre: "Quatre erreurs de calcul en classe", genre: "Erreur d’élève", niveau: 1, source: "", enonce: String.raw`Des élèves écrivent : (1) \((x + 3)^2 = x^2 + 9\) ; (2) \(\frac{1}{2 + 3} = \frac{1}{2} + \frac{1}{3}\) ; (3) \(-3^2 = 9\) ; (4) \(2^3 \times 2^4 = 4^7\). Pour chacune, donner le résultat juste et une vérification numérique qui convainc l’élève.`,
      corrige: String.raw`<p><b>(1)</b> D’après \((a + b)^2 = a^2 + 2ab + b^2\) : \((x + 3)^2 = x^2 + 6x + 9\). Vérification avec \(x = 1\) : \((1 + 3)^2 = 16\), alors que \(1^2 + 9 = 10\).</p>
        <p><b>(2)</b> \(\frac{1}{2 + 3} = \frac{1}{5}\), alors que \[\begin{aligned}\frac{1}{2} + \frac{1}{3} &= \frac{3}{6} + \frac{2}{6} \\ &= \frac{5}{6}.\end{aligned}\] L’inverse d’une somme n’est pas la somme des inverses.</p>
        <p><b>(3)</b> La puissance est prioritaire sur le signe « − » : \(-3^2 = -(3^2) = -9\). C’est \((-3)^2\) qui vaut \(9\).</p>
        <p><b>(4)</b> D’après \(a^m \times a^n = a^{m + n}\) : \(2^3 \times 2^4 = 2^7 = 128\). Vérification : \(8 \times 16 = 128\), alors que \(4^7 = 16\,384\). On additionne les exposants ; on ne multiplie pas les bases.</p>`,
      retenir: "Un test sur une valeur simple suffit à réfuter une « règle » inventée." },
    { titre: "Encadrer une somme, un produit, un quotient", genre: "Calcul", niveau: 2, source: "", enonce: String.raw`On sait que \(2 \leqslant x \leqslant 3\) et \(1 \leqslant y \leqslant 4\). Encadrer \(x + y\), \(x - y\), \(xy\) et \(\frac{x}{y}\). Quelle erreur fréquente commet-on pour \(x - y\) ?`,
      corrige: String.raw`<p><b>Somme.</b> On additionne membre à membre deux inégalités de même sens : \(2 + 1 \leqslant x + y \leqslant 3 + 4\), soit \(3 \leqslant x + y \leqslant 7\).</p>
        <p><b>Différence.</b> En multipliant \(1 \leqslant y \leqslant 4\) par \(-1 < 0\), le sens change : \(-4 \leqslant -y \leqslant -1\). On additionne avec \(2 \leqslant x \leqslant 3\) : \(-2 \leqslant x - y \leqslant 2\).</p>
        <p><b>Produit.</b> Tous les membres sont positifs, on peut donc multiplier membre à membre : \(2 \times 1 \leqslant xy \leqslant 3 \times 4\), soit \(2 \leqslant xy \leqslant 12\).</p>
        <p><b>Quotient.</b> La fonction inverse est décroissante sur \(]0 ; +\infty[\), donc \(\frac{1}{4} \leqslant \frac{1}{y} \leqslant 1\). Par produit de nombres positifs : \(\frac{2}{4} \leqslant \frac{x}{y} \leqslant 3\), soit \(\frac{1}{2} \leqslant \frac{x}{y} \leqslant 3\).</p>
        <p><b>Erreur fréquente.</b> Soustraire les bornes donnerait « \(2 - 1 \leqslant x - y \leqslant 3 - 4\) », soit \(1 \leqslant x - y \leqslant -1\), ce qui est absurde. On ne soustrait jamais deux inégalités.</p>`,
      retenir: "Pour une différence, encadrer −y puis additionner ; pour un quotient, encadrer 1/y puis multiplier (tout positif)." },
    { titre: "Un élève de plus a la moyenne", genre: "Situation concrète", niveau: 2, source: "", enonce: String.raw`Dans une classe, \(12\) élèves sur \(25\) ont la moyenne. Un nouvel élève arrive, et il a la moyenne. a) La proportion augmente-t-elle ? b) Démontrer que pour \(0 < a < b\), \(\frac{a+1}{b+1} > \frac{a}{b}\).`,
      corrige: String.raw`<p><b>a)</b> Avant : \(\frac{12}{25} = 0{,}48\). Après : \(\frac{13}{26} = 0{,}5\). La proportion augmente.</p>
        <p><b>b)</b> Soient \(a\) et \(b\) des réels tels que \(0 < a < b\). On étudie le signe de la différence, réduite au dénominateur commun \(b(b + 1)\), non nul :</p>
        <p>\[\begin{aligned}\dfrac{a + 1}{b + 1} - \dfrac{a}{b} &= \dfrac{b(a + 1) - a(b + 1)}{b(b + 1)} \\ &= \dfrac{ab + b - ab - a}{b(b + 1)} \\ &= \dfrac{b - a}{b(b + 1)}.\end{aligned}\]</p>
        <p>Le numérateur \(b - a\) est strictement positif car \(a < b\) ; le dénominateur aussi car \(b > 0\). Le quotient est donc strictement positif.</p>
        <p><b>Conclusion.</b> \(\frac{a + 1}{b + 1} > \frac{a}{b}\).</p>`,
      retenir: "Comparer deux quotients : étudier le signe de leur différence, réduite au même dénominateur." },
    { titre: "Vitesse moyenne d’un aller-retour", genre: "Situation concrète", niveau: 2, source: "", enonce: String.raw`Un enseignant fait l’aller de Mamoudzou à son collège à \(60\) km/h de moyenne, et le retour, sur la même route, à \(40\) km/h. a) Sa vitesse moyenne sur l’aller-retour est-elle \(50\) km/h ? b) Pour des vitesses \(a, b > 0\), montrer que la vitesse moyenne vaut \(\frac{2ab}{a+b}\) et qu’elle est inférieure ou égale à \(\frac{a+b}{2}\).`,
      corrige: String.raw`<p><b>a)</b> Notons \(d > 0\) la distance en km. L’aller dure \(\frac{d}{60}\) h et le retour \(\frac{d}{40}\) h, soit au total \[\begin{aligned}\frac{d}{60} + \frac{d}{40} &= \frac{2d + 3d}{120} \\ &= \frac{d}{24}\end{aligned}\] h. La vitesse moyenne est la distance totale divisée par la durée totale : \(v = \frac{2d}{d/24} = 48\) km/h. Elle n’est donc pas de \(50\) km/h.</p>
        <p><b>b)</b> De même, la durée totale est \(\frac{d}{a} + \frac{d}{b} = \frac{d(a + b)}{ab}\), d’où \(v = 2d \times \frac{ab}{d(a + b)} = \frac{2ab}{a + b}\).</p>
        <p>Comparons à \(\frac{a + b}{2}\) : \[\begin{aligned}\frac{a + b}{2} - \frac{2ab}{a + b} &= \frac{(a + b)^2 - 4ab}{2(a + b)} \\ &= \frac{(a - b)^2}{2(a + b)},\end{aligned}\] positif ou nul car \(a + b > 0\).</p>
        <p><b>Conclusion.</b> \(v = \frac{2ab}{a + b} \leqslant \frac{a + b}{2}\), avec égalité si et seulement si \(a = b\).</p>`,
      retenir: "Une vitesse moyenne est une distance totale sur une durée totale, pas la moyenne des vitesses." },
    { titre: "TVA et retour au prix de départ", genre: "Situation concrète", niveau: 1, source: "", enonce: String.raw`a) Un article coûte \(120\) € TTC, avec une TVA de \(20\,\%\). Un élève dit : « le prix hors taxe est \(120 - 24 = 96\) € ». A-t-il raison ? b) Après une hausse de \(25\,\%\), quelle baisse ramène au prix initial ? c) Généraliser à une hausse de \(t\,\%\).`,
      corrige: String.raw`<p><b>a)</b> Notons \(H\) le prix hors taxe. La TVA de \(20\,\%\) s’applique au prix HT : \(120 = 1{,}2\,H\), donc \(H = \frac{120}{1{,}2} = 100\) €. L’élève a tort : il a pris \(20\,\%\) du prix TTC au lieu du prix HT. Vérification : \(96 \times 1{,}2 = 115{,}20 \neq 120\).</p>
        <p><b>b)</b> Après la hausse, le prix est multiplié par \(1{,}25\). On cherche le coefficient \(c\) tel que \(1{,}25 \times c = 1\) : \(c = \frac{1}{1{,}25} = 0{,}8 = 1 - 0{,}2\). Il faut une baisse de \(20\,\%\).</p>
        <p><b>c)</b> Pour une hausse de \(t\,\%\) (\(t > 0\)), il faut \[\begin{aligned}c &= \frac{1}{1 + t/100} \\ &= \frac{100}{100 + t} \\ &= 1 - \frac{t}{100 + t}.\end{aligned}\] La baisse nécessaire est de \(\frac{100\,t}{100 + t}\,\%\).</p>
        <p><b>Conclusion.</b> Cette baisse est strictement inférieure à \(t\,\%\), puisque \(\frac{100}{100 + t} < 1\).</p>`,
      retenir: "Revenir en arrière, c’est diviser par le coefficient multiplicateur, pas soustraire le même pourcentage." },
    { titre: "Points ou pourcents ?", genre: "Situation concrète", niveau: 1, source: "", enonce: String.raw`a) Le taux de réussite d’un collège au brevet passe de \(40\,\%\) à \(50\,\%\). Augmentation en points ? en pourcentage ? b) \(60\,\%\) des élèves sont demi-pensionnaires et, parmi eux, \(45\,\%\) sont des filles. Quelle part de l’ensemble des élèves représentent les filles demi-pensionnaires ?`,
      corrige: String.raw`<p><b>a)</b> L’écart entre les deux taux est de \(50 - 40 = 10\) points de pourcentage. Le taux d’évolution est \(\frac{50 - 40}{40} = 0{,}25\), soit une hausse de \(25\,\%\).</p>
        <p><b>b)</b> Notons \(N\) l’effectif du collège. Il y a \(0{,}6\,N\) demi-pensionnaires, dont \(0{,}45 \times 0{,}6\,N = 0{,}27\,N\) filles.</p>
        <p><b>Conclusion.</b> Les filles demi-pensionnaires représentent \(27\,\%\) des élèves du collège.</p>`,
      retenir: "Différence de deux taux : en points. Proportion d’une sous-population : on multiplie les proportions." },
    { titre: "Vrai–Faux justifié, série 1", genre: "Vrai–Faux", niveau: 2, source: "Format des Vrai–Faux Mayotte", enonce: String.raw`Vrai ou faux ? Justifier. a) Pour tous réels \(a\) et \(b\), si \(a^2 = b^2\) alors \(a = b\). b) La somme de deux nombres irrationnels est irrationnelle. c) Pour tous réels \(a\) et \(b\), \(|a + b| \leqslant |a| + |b|\). d) Pour tout réel \(x\), si \(x < 1\) alors \(x^2 < 1\).`,
      corrige: String.raw`<p><b>a) Faux.</b> Contre-exemple : \(a = 1\) et \(b = -1\) vérifient \(a^2 = b^2 = 1\), mais \(a \neq b\). En réalité, \[\begin{aligned}a^2 = b^2 &\iff (a - b)(a + b) = 0 \\ &\iff a = b \text{ ou } a = -b.\end{aligned}\]</p>
        <p><b>b) Faux.</b> \(\sqrt{2}\) est irrationnel, donc \(-\sqrt{2}\) aussi (sinon \(\sqrt{2} = -(-\sqrt{2})\) serait rationnel). Pourtant \(\sqrt{2} + (-\sqrt{2}) = 0\) est rationnel.</p>
        <p><b>c) Vrai.</b> Soient \(a\) et \(b\) deux réels. Les deux membres sont positifs ; or, pour \(A, B \geqslant 0\), \(A^2 \leqslant B^2\) entraîne \(A \leqslant B\) (croissance de la racine carrée). Il suffit donc de comparer les carrés : \[\begin{aligned}(|a| + |b|)^2 - |a + b|^2 &= a^2 + 2|a||b| + b^2 - (a^2 + 2ab + b^2) \\ &= 2(|ab| - ab) \geqslant 0,\end{aligned}\] car \(ab \leqslant |ab|\). Donc \(|a + b| \leqslant |a| + |b|\).</p>
        <p><b>d) Faux.</b> \(x = -2\) vérifie \(x < 1\), mais \(x^2 = 4 \geqslant 1\).</p>`,
      retenir: "Faux : un contre-exemple explicite. Vrai : une preuve générale." },
    { titre: "Vrai–Faux justifié, série 2", genre: "Vrai–Faux", niveau: 3, source: "Format des Vrai–Faux Mayotte", enonce: String.raw`Vrai ou faux ? Justifier. a) Le produit de deux irrationnels est irrationnel. b) Pour tous entiers \(a, b, c, d\) avec \(b\), \(d\) et \(b + d\) non nuls, \(\frac{a + c}{b + d} = \frac{a}{b} + \frac{c}{d}\). c) Pour tout \(x \in \,]0 ; 1[\), \(\sqrt{x} > x\). d) Pour tout entier \(n\), si \(n^2\) est multiple de \(3\), alors \(n\) est multiple de \(3\).`,
      corrige: String.raw`<p><b>a) Faux.</b> \(\sqrt{2}\) est irrationnel, et pourtant \(\sqrt{2} \times \sqrt{2} = 2\) est rationnel.</p>
        <p><b>b) Faux.</b> Pour \(a = b = c = d = 1\) : \(\frac{a + c}{b + d} = \frac{2}{2} = 1\), alors que \(\frac{a}{b} + \frac{c}{d} = 2\).</p>
        <p><b>c) Vrai.</b> Soit \(x \in \,]0 ; 1[\). La racine carrée étant strictement croissante, \(\sqrt{0} < \sqrt{x} < \sqrt{1}\), soit \(0 < \sqrt{x} < 1\). Alors \[\begin{aligned}\sqrt{x} - x &= \sqrt{x} - (\sqrt{x})^2 \\ &= \sqrt{x}\,(1 - \sqrt{x})\end{aligned}\] est le produit de deux nombres strictement positifs, donc \(\sqrt{x} > x\).</p>
        <p><b>d) Vrai.</b> Raisonnons par contraposée : montrons que si \(n\) n’est pas multiple de \(3\), alors \(n^2\) n’est pas multiple de \(3\). Soit \(n\) un tel entier : il existe \(k \in \mathbb{Z}\) tel que \(n = 3k + 1\) ou \(n = 3k + 2\).<br>
        Si \(n = 3k + 1\) : \(n^2 = 9k^2 + 6k + 1 = 3(3k^2 + 2k) + 1\).<br>
        Si \(n = 3k + 2\) : \(n^2 = 9k^2 + 12k + 4 = 3(3k^2 + 4k + 1) + 1\).<br>
        Dans les deux cas, le reste de la division euclidienne de \(n^2\) par \(3\) vaut \(1\) : \(n^2\) n’est pas multiple de \(3\). La contraposée est vraie, donc la proposition aussi.</p>`,
      retenir: "Pour « n² multiple de 3 ⇒ n multiple de 3 » : contraposée et restes modulo 3, comme pour la parité." },
    { titre: "Pythagore, réciproque et contraposée", genre: "Regard de prof", niveau: 2, source: "", enonce: String.raw`Un élève de Quatrième écrit : « D’après le théorème de Pythagore, comme \(5^2 + 12^2 = 13^2\), le triangle est rectangle. » a) Énoncer le théorème de Pythagore sous forme d’implication, puis sa réciproque et sa contraposée. b) Quelle propriété fallait-il citer ? c) Le triangle de côtés \(6\), \(8\) et \(11\) est-il rectangle ? Quelle propriété utiliser ?`,
      corrige: String.raw`<p><b>a)</b> Soit \(ABC\) un triangle.<br>
        <i>Théorème de Pythagore</i> : si \(ABC\) est rectangle en \(C\), alors \(AB^2 = AC^2 + BC^2\).<br>
        <i>Réciproque</i> : si \(AB^2 = AC^2 + BC^2\), alors \(ABC\) est rectangle en \(C\). Elle est vraie, mais c’est un théorème distinct.<br>
        <i>Contraposée</i> : si \(AB^2 \neq AC^2 + BC^2\), alors \(ABC\) n’est pas rectangle en \(C\). Elle est vraie, car équivalente au théorème.</p>
        <p><b>b)</b> L’élève part de l’égalité pour conclure à l’angle droit : c’est la <b>réciproque</b> qu’il fallait citer. Rédaction attendue : « Le plus grand côté mesure \(13\). D’une part \(13^2 = 169\) ; d’autre part \(5^2 + 12^2 = 25 + 144 = 169\). Comme \(13^2 = 5^2 + 12^2\), d’après la réciproque du théorème de Pythagore, le triangle est rectangle, l’angle droit étant opposé au côté de longueur \(13\). »</p>
        <p><b>c)</b> Le plus grand côté mesure \(11\). D’une part \(11^2 = 121\) ; d’autre part \(6^2 + 8^2 = 36 + 64 = 100\). Comme \(121 \neq 100\), d’après la contraposée du théorème de Pythagore, le triangle n’est pas rectangle au sommet opposé au côté de longueur \(11\). Il ne peut pas non plus l’être en un autre sommet : l’hypoténuse, plus grand côté d’un triangle rectangle, serait alors le côté de longueur \(6\) ou \(8\), plus court que celui de longueur \(11\).</p>
        <p><b>Conclusion.</b> Le triangle de côtés \(6\), \(8\) et \(11\) n’est pas rectangle.</p>`,
      retenir: "Prouver un angle droit : réciproque. Prouver qu’il n’y en a pas : contraposée. C’est la logique vue en Seconde." },
    { titre: "Fonction croissante : définir et nier", genre: "Logique", niveau: 3, source: "", enonce: String.raw`a) Écrire avec des quantificateurs « \(f\) est croissante sur \(I\) ». b) Écrire sa négation. c) Montrer que \(x \mapsto x^2\) n’est pas croissante sur \(\mathbb{R}\). Est-elle décroissante sur \(\mathbb{R}\) ?`,
      corrige: String.raw`<p><b>a)</b> \(f\) est croissante sur \(I\) si et seulement si \[\forall a \in I,\ \forall b \in I,\ (a \leqslant b \Rightarrow f(a) \leqslant f(b)).\]</p>
        <p><b>b)</b> Comme non(\(P \Rightarrow Q\)) ≡ \(P\) et non \(Q\), la négation est : \[\exists a \in I,\ \exists b \in I,\ (a \leqslant b \text{ et } f(a) > f(b)).\]</p>
        <p><b>c)</b> Notons \(f(x) = x^2\). Pour \(a = -2\) et \(b = 1\) : \(a \leqslant b\) et \(f(a) = 4 > 1 = f(b)\). La négation est vérifiée, donc \(f\) n’est pas croissante sur \(\mathbb{R}\).</p>
        <p>De même, « \(f\) décroissante sur \(\mathbb{R}\) » s’écrit \[\forall a, b \in \mathbb{R},\ (a \leqslant b \Rightarrow f(a) \geqslant f(b)).\] Pour \(a = 0\) et \(b = 1\) : \(a \leqslant b\) et \(f(0) = 0 < 1 = f(1)\). Donc \(f\) n’est pas décroissante sur \(\mathbb{R}\).</p>
        <p><b>Conclusion.</b> \(x \mapsto x^2\) n’est ni croissante ni décroissante sur \(\mathbb{R}\) : « non croissante » ne signifie pas « décroissante ».</p>`,
      retenir: "La négation d’un « pour tout … implique … » se prouve avec un couple (a, b) explicite." },
    { titre: "Qui a cassé la vitre ?", genre: "Situation concrète", niveau: 1, source: "", enonce: String.raw`Un seul élève parmi Anli, Bacar et Chamsia a cassé une vitre. Anli : « C’est Bacar. » Bacar : « Ce n’est pas moi. » Chamsia : « Ce n’est pas moi. » On sait qu’un seul des trois dit la vérité. Qui a cassé la vitre ?`,
      corrige: String.raw`<p>On raisonne par disjonction de cas sur le coupable, en notant dans chaque cas la valeur de vérité des trois déclarations :</p><table class="tv"><tr><th>Coupable</th><th>Anli : « c’est Bacar »</th><th>Bacar : « pas moi »</th><th>Chamsia : « pas moi »</th><th>Vérités</th></tr><tr><td>Anli</td><td>F</td><td>V</td><td>V</td><td>2</td></tr><tr><td>Bacar</td><td>V</td><td>F</td><td>V</td><td>2</td></tr><tr><td>Chamsia</td><td>F</td><td>V</td><td>F</td><td>1</td></tr></table><p>Seul le troisième cas respecte la condition « un seul des trois dit la vérité ».</p>
        <p><b>Conclusion.</b> C’est Chamsia qui a cassé la vitre.</p>`,
      retenir: "Quand les cas sont en nombre fini, on les teste tous, sans en oublier." },
    { titre: "Intervalles : et, ou, sauf", genre: "Logique", niveau: 1, source: "", enonce: String.raw`Soient \(A = [-2 ; 3[\) et \(B = \,]1 ; 5]\). Déterminer \(A \cap B\), \(A \cup B\) et l’ensemble des réels de \(A\) qui ne sont pas dans \(B\). Relier chaque opération à un mot logique.`,
      corrige: String.raw`<p>Une représentation de \(A = [-2 ; 3[\) et \(B = \,]1 ; 5]\) sur une droite graduée aide à lire les résultats.</p>
        <p>\(A \cap B\) contient les réels qui sont dans \(A\) <b>et</b> dans \(B\) : \[\begin{aligned}x \in A \cap B &\iff (-2 \leqslant x < 3 \text{ et } 1 < x \leqslant 5) \\ &\iff 1 < x < 3.\end{aligned}\] Donc \(A \cap B = \,]1 ; 3[\).</p>
        <p>\(A \cup B\) contient les réels qui sont dans \(A\) <b>ou</b> dans \(B\). Les deux intervalles se chevauchent, donc \(A \cup B = [-2 ; 5]\).</p>
        <p>Les réels de \(A\) qui ne sont pas dans \(B\) vérifient \(-2 \leqslant x < 3\) <b>et non</b> (\(1 < x \leqslant 5\)), c’est-à-dire \(-2 \leqslant x < 3\) et (\(x \leqslant 1\) ou \(x > 5\)), soit \(-2 \leqslant x \leqslant 1\).</p>
        <p><b>Conclusion.</b> \(A \cap B = \,]1 ; 3[\), \(A \cup B = [-2 ; 5]\) et \(A \setminus B = [-2 ; 1]\) ; \(1\) appartient à ce dernier ensemble car \(B\) est ouvert en \(1\).</p>`,
      retenir: "∩ ↔ et ; ∪ ↔ ou ; « privé de » ↔ et non. Soigner les crochets aux bornes." },
    { titre: "Élever au carré n’est pas une équivalence", genre: "Erreur d’élève", niveau: 2, source: "", enonce: String.raw`Un élève résout \(\sqrt{x + 2} = x\) : « J’élève au carré : \(x + 2 = x^2\), donc \(x^2 - x - 2 = 0\), \((x - 2)(x + 1) = 0\), \(S = \{-1 ; 2\}\). » Trouver l’erreur et corriger.`,
      corrige: String.raw`<p><b>L’erreur.</b> L’élève écrit comme des équivalences ce qui n’est qu’une implication : \(\sqrt{x + 2} = x \Rightarrow x + 2 = x^2\), mais la réciproque est fausse, car deux nombres opposés ont le même carré. Il obtient seulement des candidats, qu’il doit vérifier.</p>
        <p><b>Correction.</b> L’équation est définie pour \(x \geqslant -2\). Pour un tel \(x\), \(\sqrt{x + 2} \geqslant 0\), donc :</p>
        <p>\[\begin{aligned}\sqrt{x + 2} = x &\iff (x \geqslant 0 \text{ et } x + 2 = x^2) \\ &\iff (x \geqslant 0 \text{ et } (x - 2)(x + 1) = 0) \\ &\iff x = 2.\end{aligned}\]</p>
        <p>Vérification : \(\sqrt{2 + 2} = 2\), tandis que pour \(x = -1\), \(\sqrt{1} = 1 \neq -1\).</p>
        <p><b>Conclusion.</b> \(S = \{2\}\).</p>`,
      retenir: "a = b ⇒ a² = b², mais pas l’inverse : vérifier les solutions, ou imposer le signe." },
    { titre: "Ordres de grandeur", genre: "Calcul", niveau: 1, source: "", enonce: String.raw`a) Un disque de \(2\) To (\(2 \times 10^{12}\) octets) peut-il stocker un million de photos de \(4 \times 10^{6}\) octets ? b) La lumière parcourt \(3 \times 10^{8}\) m/s et la distance Terre–Soleil vaut environ \(1{,}5 \times 10^{11}\) m. Combien de temps met la lumière du Soleil pour nous arriver ?`,
      corrige: String.raw`<p><b>a)</b> Le nombre de photos stockables est \[\begin{aligned}\frac{2 \times 10^{12}}{4 \times 10^{6}} &= \frac{2}{4} \times 10^{12 - 6} \\ &= 0{,}5 \times 10^{6} \\ &= 5 \times 10^{5}.\end{aligned}\] Le disque peut stocker \(500\,000\) photos, deux fois moins qu’un million : la réponse est non.</p>
        <p><b>b)</b> Durée = distance ÷ vitesse : \[\begin{aligned}t &= \frac{1{,}5 \times 10^{11}}{3 \times 10^{8}} \\ &= 0{,}5 \times 10^{3} \\ &= 500\end{aligned}\] s. Comme \(500 = 8 \times 60 + 20\), la lumière du Soleil met environ \(8\) min \(20\) s pour nous parvenir.</p>`,
      retenir: "Diviser les mantisses, soustraire les exposants, puis remettre en écriture scientifique." },
    { titre: "Une somme de carrés nulle", genre: "Preuve", niveau: 2, source: "", enonce: String.raw`Démontrer que pour tous réels \(a\) et \(b\) : \(a^2 + b^2 = 0 \iff a = b = 0\). Application : résoudre \((x - 1)^2 + (y + 2)^2 = 0\).`,
      corrige: String.raw`<p>Soient \(a\) et \(b\) deux réels. On démontre les deux implications.</p>
        <p><b>(⇐)</b> Si \(a = b = 0\), alors \(a^2 + b^2 = 0 + 0 = 0\).</p>
        <p><b>(⇒)</b> Supposons \(a^2 + b^2 = 0\). Comme \(b^2 \geqslant 0\), on a \(a^2 = -b^2 \leqslant 0\) ; comme aussi \(a^2 \geqslant 0\), il vient \(a^2 = 0\), donc \(a = 0\). Les rôles de \(a\) et \(b\) étant symétriques, \(b = 0\).</p>
        <p>L’équivalence est démontrée.</p>
        <p><b>Application.</b> En appliquant ce résultat à \(a = x - 1\) et \(b = y + 2\) : \[\begin{aligned}(x - 1)^2 + (y + 2)^2 = 0 &\iff (x - 1 = 0 \text{ et } y + 2 = 0) \\ &\iff (x = 1 \text{ et } y = -2).\end{aligned}\]</p>
        <p><b>Conclusion.</b> L’unique couple solution est \((1 ; -2)\).</p>`,
      retenir: "Une équivalence se prouve dans les deux sens, en le disant." },
    { titre: "Entiers consécutifs", genre: "Preuve", niveau: 1, source: "", enonce: String.raw`a) Démontrer que la somme de trois entiers consécutifs est divisible par \(3\). b) Démontrer que la somme de quatre entiers consécutifs n’est jamais divisible par \(4\).`,
      corrige: String.raw`<p><b>a)</b> Trois entiers consécutifs s’écrivent \(n - 1\), \(n\), \(n + 1\) avec \(n \in \mathbb{Z}\) (on nomme celui du milieu). Leur somme vaut \((n - 1) + n + (n + 1) = 3n\) : c’est un multiple de \(3\).</p>
        <p><b>b)</b> Quatre entiers consécutifs s’écrivent \(n\), \(n + 1\), \(n + 2\), \(n + 3\) avec \(n \in \mathbb{Z}\). Leur somme vaut \(4n + 6 = 4(n + 1) + 2\). Comme \(n + 1 \in \mathbb{Z}\) et \(0 \leqslant 2 < 4\), c’est la division euclidienne de cette somme par \(4\) : le reste vaut \(2\).</p>
        <p><b>Conclusion.</b> La somme de trois entiers consécutifs est toujours divisible par \(3\) ; celle de quatre entiers consécutifs ne l’est jamais par \(4\).</p>`,
      retenir: "Bien choisir l’inconnue (le milieu) simplifie le calcul." },
    { titre: "Inéquation avec un quotient", genre: "Calcul", niveau: 2, source: "", enonce: String.raw`Résoudre \(\frac{2x - 1}{x + 3} \leqslant 1\). Pourquoi ne peut-on pas « multiplier par \(x + 3\) » directement ?`,
      corrige: String.raw`<p>La valeur \(-3\) est interdite. Pour \(x \neq -3\), on compare à \(0\) :</p>
        <p>\[\begin{aligned}\dfrac{2x - 1}{x + 3} \leqslant 1 &\iff \dfrac{2x - 1}{x + 3} - 1 \leqslant 0 \\ &\iff \dfrac{2x - 1 - (x + 3)}{x + 3} \leqslant 0 \\ &\iff \dfrac{x - 4}{x + 3} \leqslant 0.\end{aligned}\]</p>
        <p>\(x - 4\) s’annule en \(4\) et \(x + 3\) en \(-3\). Tableau de signes :</p><table class="tv"><tr><th>\(x\)</th><th>\(]-\infty ; -3[\)</th><th>\(-3\)</th><th>\(]-3 ; 4[\)</th><th>\(4\)</th><th>\(]4 ; +\infty[\)</th></tr><tr><td>\(x - 4\)</td><td>−</td><td>−</td><td>−</td><td>0</td><td>+</td></tr><tr><td>\(x + 3\)</td><td>−</td><td>0</td><td>+</td><td>+</td><td>+</td></tr><tr><td>quotient</td><td>+</td><td>interdit</td><td>−</td><td>0</td><td>+</td></tr></table><p><b>Conclusion.</b> \(S = \,]-3 ; 4]\).</p>
        <p><b>Pourquoi ne pas multiplier par \(x + 3\).</b> Le signe de \(x + 3\) dépend de \(x\) : pour \(x < -3\), on multiplierait par un nombre négatif, ce qui change le sens de l’inégalité. On trouverait à tort \(x \leqslant 4\), en gardant les \(x < -3\), qui ne sont pas solutions (par exemple \(x = -4\) donne \(9 > 1\)).</p>`,
      retenir: "Inéquation avec quotient : tout passer d’un côté, réduire, tableau de signes, valeurs interdites exclues." },
    { titre: "Une racine sous une droite", genre: "Preuve", niveau: 2, source: "", enonce: String.raw`Démontrer que pour tout \(x \geqslant 0\), \(\sqrt{1 + x} \leqslant 1 + \frac{x}{2}\). En déduire une valeur approchée par excès de \(\sqrt{1{,}02}\) et l’erreur commise.`,
      corrige: String.raw`<p>Soit \(x \geqslant 0\). Les deux membres sont positifs : \(\sqrt{1 + x} \geqslant 0\) et \(1 + \frac{x}{2} > 0\). Or, pour \(A, B \geqslant 0\), \(A \leqslant B \iff A^2 \leqslant B^2\), car la fonction carré est strictement croissante sur \([0 ; +\infty[\). Il suffit donc de comparer les carrés :</p>
        <p>\[\begin{aligned}\left(1 + \frac{x}{2}\right)^2 - \left(\sqrt{1 + x}\right)^2 &= 1 + x + \frac{x^2}{4} - (1 + x) \\ &= \frac{x^2}{4} \geqslant 0.\end{aligned}\]</p>
        <p>Donc, pour tout \(x \geqslant 0\), \(\sqrt{1 + x} \leqslant 1 + \frac{x}{2}\).</p>
        <p><b>Application.</b> Avec \(x = 0{,}02\) : \(\sqrt{1{,}02} \leqslant 1{,}01\). Grâce à l’expression conjuguée, l’erreur vaut \[\begin{aligned}1{,}01 - \sqrt{1{,}02} &= \frac{1{,}01^2 - 1{,}02}{1{,}01 + \sqrt{1{,}02}} \\ &= \frac{0{,}0001}{1{,}01 + \sqrt{1{,}02}}.\end{aligned}\] Le dénominateur étant supérieur à \(1\), l’erreur est inférieure à \(10^{-4}\).</p>`,
      retenir: "Pour A, B ⩾ 0 : A ⩽ B ⇔ A² ⩽ B². Vérifier les signes avant de passer au carré." },
    { titre: "Le « ou » des mathématiciens", genre: "Logique", niveau: 1, source: "", enonce: String.raw`Au restaurant scolaire, le menu dit « fromage ou dessert ». a) En mathématiques, « \(P\) ou \(Q\) » est-elle vraie quand \(P\) et \(Q\) sont toutes les deux vraies ? b) Nier « fromage ou dessert ». c) Nier « \(x \leqslant -1\) ou \(x \geqslant 3\) » et l’écrire avec un intervalle.`,
      corrige: String.raw`<p><b>a)</b> Oui. En mathématiques, « P ou Q » est vraie dès que l’une au moins des deux propositions est vraie, y compris quand les deux le sont : c’est un « ou » <b>inclusif</b>. Le menu emploie un « ou » <b>exclusif</b> (l’un ou l’autre, mais pas les deux) :</p><table class="tv"><tr><th>P</th><th>Q</th><th>P ou Q (inclusif)</th><th>ou exclusif</th></tr><tr><td>V</td><td>V</td><td>V</td><td class="f">F</td></tr><tr><td>V</td><td>F</td><td>V</td><td>V</td></tr><tr><td>F</td><td>V</td><td>V</td><td>V</td></tr><tr><td>F</td><td>F</td><td>F</td><td>F</td></tr></table><p>Par exemple, « \(ab = 0 \iff a = 0\) ou \(b = 0\) » inclut le cas \(a = b = 0\).</p>
        <p><b>b)</b> Notons P : « je prends du fromage » et Q : « je prends un dessert ». La table montre que non(P ou Q) et (non P) et (non Q) ont les mêmes valeurs de vérité (loi de De Morgan) :</p><table class="tv"><tr><th>P</th><th>Q</th><th>P ou Q</th><th>non(P ou Q)</th><th>non P</th><th>non Q</th><th>(non P) et (non Q)</th></tr><tr><td>V</td><td>V</td><td>V</td><td>F</td><td>F</td><td>F</td><td>F</td></tr><tr><td>V</td><td>F</td><td>V</td><td>F</td><td>F</td><td>V</td><td>F</td></tr><tr><td>F</td><td>V</td><td>V</td><td>F</td><td>V</td><td>F</td><td>F</td></tr><tr><td>F</td><td>F</td><td>F</td><td>V</td><td>V</td><td>V</td><td>V</td></tr></table><p>La négation est donc : « ni fromage, ni dessert ».</p>
        <p><b>c)</b> non(\(x \leqslant -1\) ou \(x \geqslant 3\)) ≡ (\(x > -1\) et \(x < 3\)) ≡ \(-1 < x < 3\).</p>
        <p><b>Conclusion.</b> L’ensemble cherché est \(]-1 ; 3[\).</p>`,
      retenir: "Le « ou » mathématique est inclusif ; sa négation est un « et »." }
  ],
  qcm: [
    { q: String.raw`\(P \Rightarrow Q\) est fausse lorsque…`, choix: ["P et Q sont fausses", "P est fausse et Q est vraie", "P est vraie et Q est fausse", "P et Q sont vraies"], ok: 2, expl: "C’est le seul cas où une implication est fausse." },
    { q: String.raw`La contraposée de « si \(x > 2\) alors \(x^2 > 4\) » est…`, choix: [String.raw`si \(x^2 > 4\) alors \(x > 2\)`, String.raw`si \(x^2 \leqslant 4\) alors \(x \leqslant 2\)`, String.raw`si \(x \leqslant 2\) alors \(x^2 \leqslant 4\)`, String.raw`si \(x^2 < 4\) alors \(x < 2\)`], ok: 1, expl: "Contraposée : non Q ⇒ non P. La négation de > est ⩽." },
    { q: String.raw`La négation de « \(\forall x \in \mathbb{R},\ f(x) > 0\) » est…`, choix: [String.raw`\(\forall x,\ f(x) \leqslant 0\)`, String.raw`\(\exists x,\ f(x) < 0\)`, String.raw`\(\exists x,\ f(x) \leqslant 0\)`, String.raw`\(\forall x,\ f(x) < 0\)`], ok: 2, expl: "∀ devient ∃ et > devient ⩽ (attention au cas d’égalité)." },
    { q: String.raw`Pour prouver que « pour tout entier \(n\), \(n^2 + n + 41\) est premier » est faux, il suffit…`, choix: ["de vérifier n = 0, 1, 2", "de trouver un seul n qui ne convient pas", "de raisonner par récurrence", "c’est impossible, la phrase est vraie"], ok: 1, expl: String.raw`Un contre-exemple suffit : \(n = 40\) donne \(40^2 + 40 + 41 = 41^2\).` },
    { q: String.raw`\(\dfrac{2^{10} \times 4^{-3}}{8}\) vaut…`, choix: ["1", "2", "1/2", "4"], ok: 1, expl: String.raw`\(4^{-3} = 2^{-6}\) et \(8 = 2^{3}\), donc \(2^{10} \times 2^{-6} \times 2^{-3} = 2^{1} = 2\).` },
    { q: String.raw`\(\sqrt{12} + \sqrt{27}\) vaut…`, choix: [String.raw`\(\sqrt{39}\)`, String.raw`\(5\sqrt{3}\)`, String.raw`\(6\sqrt{3}\)`, String.raw`\(13\)`], ok: 1, expl: String.raw`\(2\sqrt{3} + 3\sqrt{3} = 5\sqrt{3}\). On n’additionne jamais sous la racine.` },
    { q: "Une hausse de 10 % suivie d’une hausse de 10 % donne une hausse de…", choix: ["20 %", "21 %", "19 %", "10 %"], ok: 1, expl: String.raw`\(1{,}1^2 = 1{,}21\).` },
    { q: String.raw`Si \(-3 \leqslant x \leqslant 1\), alors \(x^2\) est dans…`, choix: [String.raw`\([1;9]\)`, String.raw`\([0;9]\)`, String.raw`\([-9;1]\)`, String.raw`\([0;1]\)`], ok: 1, expl: "La fonction carré n’est pas monotone sur [−3 ; 1] : le minimum 0 est atteint en x = 0, le maximum 9 en x = −3." },
    { q: String.raw`\(|x - 1| < 3\) équivaut à…`, choix: [String.raw`\(x < 4\)`, String.raw`\(-2 < x < 4\)`, String.raw`\(-4 < x < 2\)`, String.raw`\(x > -2\)`], ok: 1, expl: "x est à distance strictement moins de 3 de 1." },
    { q: "Pour démontrer « si n² est pair, alors n est pair », le plus simple est…", choix: ["un raisonnement direct", "la contraposée", "un exemple", "la récurrence"], ok: 1, expl: "On montre « n impair ⇒ n² impair », qui se fait en une ligne." },
    { q: "La réciproque de « si un quadrilatère est un carré, alors c’est un losange » est…", choix: ["si un quadrilatère n’est pas un losange, alors ce n’est pas un carré", "si un quadrilatère est un losange, alors c’est un carré", "si un quadrilatère n’est pas un carré, alors ce n’est pas un losange", "un quadrilatère est un carré si et seulement si c’est un losange"], ok: 1, expl: "La réciproque de P ⇒ Q est Q ⇒ P. Ici elle est fausse : un losange sans angle droit n’est pas un carré. La première proposition est la contraposée." },
    { q: String.raw`Si \(P\) est fausse, alors l’implication \(P \Rightarrow Q\) est…`, choix: ["toujours vraie", "toujours fausse", "vraie si et seulement si Q est vraie", "ni vraie ni fausse"], ok: 0, expl: "Une implication n’est fausse que si P est vraie et Q fausse. Avec P fausse, elle est vraie quelle que soit Q." },
    { q: "La négation de « il existe un élève qui a réussi toutes les épreuves » est…", choix: ["il existe un élève qui a raté toutes les épreuves", "tout élève a raté au moins une épreuve", "tout élève a raté toutes les épreuves", "il existe un élève qui a raté au moins une épreuve"], ok: 1, expl: "« Il existe » devient « pour tout », et « toutes les épreuves réussies » devient « au moins une épreuve ratée »." },
    { q: String.raw`La négation de « \(x \geqslant 2\) et \(y < 1\) » est…`, choix: [String.raw`\(x < 2\) et \(y \geqslant 1\)`, String.raw`\(x < 2\) ou \(y \geqslant 1\)`, String.raw`\(x \leqslant 2\) ou \(y > 1\)`, String.raw`\(x > 2\) et \(y \geqslant 1\)`], ok: 1, expl: "non(A et B) ≡ (non A) ou (non B), puis on nie chaque inégalité : ⩾ devient <, < devient ⩾." },
    { q: String.raw`La proposition « \(\exists x \in \mathbb{R},\ \forall y \in \mathbb{R},\ x + y = 0\) » est…`, choix: [String.raw`vraie, avec \(x = 0\)`, String.raw`vraie, avec \(x = -y\)`, "fausse", "ni vraie ni fausse"], ok: 2, expl: String.raw`Le même \(x\) devrait convenir pour tous les \(y\) : \(y = 0\) impose \(x = 0\), \(y = 1\) impose \(x = -1\). Contradiction. « \(x = -y\) » ferait dépendre \(x\) de \(y\), ce que l’ordre ∃ puis ∀ interdit.` },
    { q: String.raw`Pour démontrer « \(\exists n \in \mathbb{N},\ n^2 > 100\,n\) », il suffit…`, choix: [String.raw`de raisonner par récurrence sur \(n\)`, String.raw`d’exhiber un entier qui convient, par exemple \(n = 101\)`, String.raw`de montrer que \(n^2 > 100\,n\) pour tout \(n\)`, "de raisonner par l’absurde obligatoirement"], ok: 1, expl: String.raw`Un « il existe » se prouve par un exemple : \(101^2 = 101 \times 101 > 100 \times 101\).` },
    { q: String.raw`Parmi ces conditions, laquelle est <b>nécessaire</b> pour qu’un entier \(n\) soit divisible par \(4\) ?`, choix: [String.raw`\(n\) est divisible par \(8\)`, String.raw`\(n\) est pair`, String.raw`\(n\) est impair`, String.raw`\(n\) est divisible par \(3\)`], ok: 1, expl: String.raw`Nécessaire : « \(4 \mid n \Rightarrow\) condition ». Si \(n = 4k\), alors \(n = 2(2k)\) est pair. « Divisible par 8 » est suffisante, pas nécessaire (\(n = 4\)).` },
    { q: "Un raisonnement par l’absurde consiste à…", choix: ["vérifier la propriété sur plusieurs exemples", "supposer la négation de ce que l’on veut démontrer et aboutir à une contradiction", "démontrer la réciproque", "trouver un contre-exemple à la propriété"], ok: 1, expl: "On suppose le contraire de la conclusion, on déduit, et on tombe sur une proposition fausse : la supposition était donc fausse." },
    { q: String.raw`La contraposée de « si \(n\) est multiple de \(4\), alors \(n\) est pair » est…`, choix: [String.raw`si \(n\) est pair, alors \(n\) est multiple de \(4\)`, String.raw`si \(n\) est impair, alors \(n\) n’est pas multiple de \(4\)`, String.raw`si \(n\) n’est pas multiple de \(4\), alors \(n\) est impair`, String.raw`\(n\) est multiple de \(4\) et impair`], ok: 1, expl: "Contraposée de P ⇒ Q : non Q ⇒ non P. « Non pair » signifie « impair »." },
    { q: "Une seule de ces implications est vraie pour tout réel x. Laquelle ?", choix: [String.raw`\(x^2 = 9 \Rightarrow x = 3\)`, String.raw`\(x > -1 \Rightarrow x^2 > 1\)`, String.raw`\(x < -3 \Rightarrow x^2 > 9\)`, String.raw`\(x^2 > x \Rightarrow x > 1\)`], ok: 2, expl: String.raw`Si \(x < -3\), alors \(-x > 3 > 0\) et \(x^2 = (-x)^2 > 9\). Contre-exemples pour les autres : \(x = -3\), \(x = 0\), \(x = -1\).` },
    { q: String.raw`\((-2)^3 \times (-2)^{-5}\) vaut…`, choix: [String.raw`\(-\dfrac{1}{4}\)`, String.raw`\(\dfrac{1}{4}\)`, String.raw`\(4\)`, String.raw`\(-4\)`], ok: 1, expl: String.raw`\((-2)^{3 - 5} = (-2)^{-2} = \frac{1}{(-2)^2} = \frac{1}{4}\) : un exposant pair rend le résultat positif.` },
    { q: String.raw`\((3 \times 10^{4}) \times (5 \times 10^{-7})\) s’écrit en notation scientifique…`, choix: [String.raw`\(1{,}5 \times 10^{-2}\)`, String.raw`\(15 \times 10^{-3}\)`, String.raw`\(1{,}5 \times 10^{-3}\)`, String.raw`\(1{,}5 \times 10^{-28}\)`], ok: 0, expl: String.raw`\(15 \times 10^{-3} = 1{,}5 \times 10^{1} \times 10^{-3} = 1{,}5 \times 10^{-2}\). L’écriture \(15 \times 10^{-3}\) est juste mais pas scientifique (mantisse entre 1 et 10).` },
    { q: String.raw`\(\sqrt{0{,}09}\) vaut…`, choix: [String.raw`\(0{,}03\)`, String.raw`\(0{,}3\)`, String.raw`\(0{,}9\)`, String.raw`\(0{,}0081\)`], ok: 1, expl: String.raw`\(0{,}3^2 = 0{,}09\) et \(0{,}3 \geqslant 0\). Piège : \(0{,}03^2 = 0{,}0009\).` },
