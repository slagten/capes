        <p>${r >= 0.9 ? "Excellent : l’étoile du chapitre est allumée." : r >= 0.7 ? "Bien. Relis les explications des questions ratées, puis vise 90 %." : r >= 0.5 ? "Correct. Relis les « À retenir » des notions ratées, puis recommence." : "Reprends le cours notion par notion, puis recommence."}</p>
        <div><button class="tbtn" id="qcm-restart" type="button">Nouvelle série</button><span class="cursor" aria-hidden="true"></span></div>
      </div></div>`;
    bindQcmHead(el);
    $("#qcm-restart").onclick = () => startQcm(qLen);
    if (!had && hasStar(ch)) toast("Étoile allumée : 90 % au QCM.");
    return;
  }
  const q = ch.qcm[qOrder[qi]]; qanswered = false;
  qPerm = shuffle(q.choix.map((_, k) => k));
  el.innerHTML = qcmHead() + `<div class="term" role="group" aria-label="Question ${qi + 1} sur ${T}">
      <div class="term-bar"><span>QCM · SEMAINE ${ch.n}</span><span>Q ${String(qi + 1).padStart(2, "0")}/${T} · SCORE <b>${qscore}</b></span></div>
      <div class="term-body">
        <p class="dim">&gt; question ${qi + 1}</p>
        <p class="qtext">${q.q}</p>
        <div class="opts">${qPerm.map((c, k) => `<button class="opt" type="button" data-k="${k}" data-c="${c}"><span class="k">[${k + 1}]</span><span>${q.choix[c]}</span></button>`).join("")}</div>
        <p class="out" id="qcm-expl" hidden></p>
        <div><button class="tbtn" id="qcm-next" type="button" hidden>${qi + 1 < T ? "Suite" : "Voir le score"}</button><span class="cursor" aria-hidden="true"></span></div>
      </div></div>`;
  bindQcmHead(el);
  el.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (qanswered) return; qanswered = true;
    const ok = +b.dataset.c === q.ok; if (ok) qscore++;
    el.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (+x.dataset.c === q.ok) x.classList.add("good"); });
    if (!ok) b.classList.add("bad");
    const ex = $("#qcm-expl"); ex.innerHTML = (ok ? "<b>Exact.</b> " : "<b>Non.</b> ") + q.expl; ex.hidden = false; typeset(ex);
    const nx = $("#qcm-next"); nx.hidden = false; nx.focus({ preventScroll: true });
  });
  $("#qcm-next").onclick = () => { qi++; renderQcm(); };
  typeset(el);
}

/* ============ Vrai–Faux ============ */
let vfOrder = [], vfPos = 0, vfScore = 0;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startVf() { vfOrder = shuffle(ch.vf.map((_, k) => k)).slice(0, 5); vfPos = 0; vfScore = 0; renderVf(); }
function vfHead() {
  return `<article class="tablet">
      <div class="head"><span class="eyebrow">Le format du problème 1 de la composition 2</span><h2>Vrai–Faux</h2></div>
      <p class="lead">Au concours, une réponse sans justification ne rapporte rien : dis ta justification à voix haute avant de lire la correction.</p>
      <p class="keys">Clavier : <kbd>V</kbd> ou <kbd>F</kbd> pour répondre, <kbd>Entrée</kbd> pour continuer. Séries de 5 propositions tirées parmi ${ch.vf.length}.</p>
    </article>`;
}
function renderVf() {
  const el = $("#vf");
  if (vfPos >= vfOrder.length) {
    el.innerHTML = vfHead() + `<div class="term">
      <div class="term-bar"><span>VRAI–FAUX · SEMAINE ${ch.n}</span><span>FIN</span></div>
      <div class="term-body">
        <p class="dim">&gt; série terminée</p>
        <p class="big">${vfScore}/5</p>
        <p>${vfScore === 5 ? "Sans faute. Garde le réflexe : un contre-exemple pour « faux », une preuve pour « vrai »." : "Reprends les propositions ratées : pour « faux », cherche un contre-exemple ; pour « vrai », une preuve courte."}</p>
        <div><button class="tbtn" id="vf-again" type="button">Nouvelle série</button><span class="cursor" aria-hidden="true"></span></div>
      </div></div>`;
    $("#vf-again").onclick = startVf;
    return;
  }
  const it = ch.vf[vfOrder[vfPos]];
  el.innerHTML = vfHead() + `<div class="term" role="group" aria-label="Proposition ${vfPos + 1} sur 5">
      <div class="term-bar"><span>VRAI–FAUX · SEMAINE ${ch.n}</span><span>P ${vfPos + 1}/5 · SCORE <b>${vfScore}</b></span></div>
      <div class="term-body">
        <p class="dim">&gt; proposition ${vfPos + 1}</p>
        <p class="qtext">${it.p}</p>
        <div class="row"><button class="opt inline vfb" type="button" data-v="1"><span class="k">[V]</span><span>Vrai</span></button><button class="opt inline vfb" type="button" data-v="0"><span class="k">[F]</span><span>Faux</span></button></div>
        <p class="out" id="vf-expl" hidden></p>
        <div><button class="tbtn" id="vf-next" type="button" hidden>Suite</button><span class="cursor" aria-hidden="true"></span></div>
      </div></div>`;
  let answered = false;
  el.querySelectorAll(".vfb").forEach(b => b.onclick = () => {
    if (answered) return; answered = true;
    const ok = (b.dataset.v === "1") === it.v; if (ok) vfScore++;
    el.querySelectorAll(".vfb").forEach(x => { x.disabled = true; if ((x.dataset.v === "1") === it.v) x.classList.add("good"); });
    if (!ok) b.classList.add("bad");
    const ex = $("#vf-expl"); ex.innerHTML = it.j; ex.hidden = false; typeset(ex);
    const nx = $("#vf-next"); nx.hidden = false; nx.focus({ preventScroll: true });
  });
  $("#vf-next").onclick = () => { vfPos++; renderVf(); };
  typeset(el);
}

/* ============ Fiche ============ */
function renderFiche() {
  $("#fiche").innerHTML = `
    <article class="tablet">
      <div class="head"><span class="eyebrow">Semaine ${ch.n} · à savoir par cœur</span><h2>Fiche</h2></div>
      <ul class="glyphs">${ch.fiche.map(f => `<li>${f}</li>`).join("")}</ul>
    </article>
    <article class="tablet"><h3>À savoir refaire sans le cours</h3><ul class="glyphs">
      <li>Réciproque, contraposée et contre-exemple (exercice 1).</li>
      <li>Négation avec deux quantificateurs (exercice 2).</li>
      <li>« n impair ⇒ n² impair » et l’irrationalité de √2.</li>
      <li>Simplifier puissances et racines, rationaliser (exercices 7 et 8).</li>
      <li>Une inégalité sans erreur de signe (exercice 10).</li></ul>
    </article>`;
}

/* ============ Notifications ============ */
let toastTimer = 0;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3400);
}

/* ============ Jour / nuit ============ */
const root = document.documentElement;
function isDarkNow() { const a = root.getAttribute("data-theme"); return a ? a === "dark" : !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches); }
function paintThemer() {
  const d = isDarkNow(), b = $("#themer");
  b.textContent = d ? "Jour" : "Nuit";
  b.setAttribute("aria-label", d ? "Passer en mode jour" : "Passer en mode nuit");
}
$("#themer").onclick = () => {
  const next = isDarkNow() ? "light" : "dark";
  root.setAttribute("data-theme", next);
  try { localStorage.setItem(KEY + "-theme", next); } catch (e) {}
  paintThemer();
};
if (window.matchMedia) { const m = matchMedia("(prefers-color-scheme: dark)"); if (m.addEventListener) m.addEventListener("change", paintThemer); }
new MutationObserver(paintThemer).observe(root, { attributes: true, attributeFilter: ["data-theme"] });

/* ============ Onglets et navigation ============ */
const TABS = ["accueil", "cours", "exos", "qcm", "vf", "fiche"];
function show(id, scroll) {
  TABS.forEach(t => {
    $("#" + t).hidden = t !== id;
    $("#tab-" + t).setAttribute("aria-selected", t === id ? "true" : "false");
  });
  try { localStorage.setItem(KEY + "-tab", id); } catch (e) {}
  typeset($("#" + id));
  if (scroll) {
    const nav = $("nav.tabs"), y = $("#" + id).getBoundingClientRect().top + window.scrollY - nav.offsetHeight - 16;
    if (window.scrollY > y) window.scrollTo({ top: Math.max(0, y) });
  }
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => show(b.getAttribute("aria-controls"), true));
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) { show(g.dataset.go, true); return; }
  const p = e.target.closest(".gate .pc"); if (p) { goExo(+p.dataset.k); return; }
  const a = e.target.closest("a[data-notion]");
  if (a) { e.preventDefault(); document.getElementById("notion-" + a.dataset.notion).scrollIntoView({ block: "start", behavior: reduceMotion.matches ? "auto" : "smooth" }); }
});
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest("input, textarea, select")) return;
  const k = e.key.toLowerCase(), onControl = e.target.closest("button, summary, a, [role=button]");
  const p = e.target.closest(".gate .pc");
  if (p && (k === "enter" || k === " ")) { e.preventDefault(); goExo(+p.dataset.k); return; }
  if (onControl && (k === "enter" || k === " ")) return;
  const press = sel => { const b = $(sel); if (b && !b.disabled && !b.hidden) { e.preventDefault(); b.click(); } };
  const tab = TABS.find(t => !$("#" + t).hidden);
  if (tab === "qcm") { if (/^[1-4]$/.test(k)) press(`#qcm .opt[data-k="${+k - 1}"]`); else if (k === "enter") press(qi >= qOrder.length ? "#qcm-restart" : "#qcm-next"); }
  if (tab === "vf") { if (k === "v" || k === "f") press(`#vf .vfb[data-v="${k === "v" ? 1 : 0}"]`); else if (k === "enter") press(vfPos >= vfOrder.length ? "#vf-again" : "#vf-next"); }
});

/* ============ Démarrage ============ */
renderReadouts(); renderAccueil(); renderCours(); renderExos(); renderFiche(); startQcm(10); startVf(); paintThemer();
let first = "accueil";
const h = (location.hash || "").slice(1);
if (TABS.includes(h)) first = h; else { try { const t = localStorage.getItem(KEY + "-tab"); if (TABS.includes(t)) first = t; } catch (e) {} }
show(first);
Scene.setProgress(progress());
const mj = document.getElementById("mj");
function typesetAll() { if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise().catch(() => {}); }
if (window.MathJax && MathJax.typesetPromise) typesetAll();
else if (mj) mj.addEventListener("load", () => { if (MathJax.startup && MathJax.startup.promise) MathJax.startup.promise.then(typesetAll); else typesetAll(); });
</script>
</body>
</html>
